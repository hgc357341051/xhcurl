# +----------------------------------------------------------------------+
# | XHCurl 扩展 - GitHub Actions CI/CD 流水线                             |
# | 自动化编译：Linux / macOS / Windows 多平台 + 多 PHP 版本              |
# | 编译产物：各平台 .so/.dll 扩展文件                                    |
# +----------------------------------------------------------------------+

name: Build XHCurl Extension

# 触发条件：push 到 main 分支 或 创建 tag 时触发
on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]  # v1.0.0 等版本标签触发发布流程
  pull_request:
    branches: [ main ]

# 全局环境变量
env:
  # 扩展名称（用于构建脚本）
  EXTENSION_NAME: xhcurl

jobs:
  # =====================================================================
  # Job 1: Linux 平台编译（Ubuntu 22.04）
  # 支持 PHP 8.0 ~ 8.4
  # =====================================================================
  build-linux:
    name: "Linux (PHP ${{ matrix.php-version }}, Ubuntu ${{ matrix.ubuntu }})"
    runs-on: ubuntu-${{ matrix.ubuntu }}
    strategy:
      fail-fast: false  # 某个版本失败不影响其他版本继续编译
      matrix:
        php-version: ['8.0', '8.1', '8.2', '8.3', '8.4']
        ubuntu: ['22.04']

    steps:
      # -----------------------------------------------------------------
      # 步骤 1: 检出代码仓库
      # -----------------------------------------------------------------
      - name: Checkout repository
        uses: actions/checkout@v4

      # -----------------------------------------------------------------
      # 步骤 2: 安装系统依赖（libcurl 开发库 + 编译工具链）
      # -----------------------------------------------------------------
      - name: Install system dependencies
        run: |
          sudo apt-get update -y
          sudo apt-get install -y \
            libcurl4-openssl-dev \
            autoconf \
            automake \
            libtool \
            pkg-config \
            gcc \
            make \
            libc6-dev

      # -----------------------------------------------------------------
      # 步骤 3: 安装指定版本的 PHP 及开发工具
      # 使用 shivammathur/setup-php 获取完整开发环境
      # -----------------------------------------------------------------
      - name: Setup PHP ${{ matrix.php-version }}
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php-version }}
          tools: phpize, php-config
          extensions: curl, json
          coverage: none

      # -----------------------------------------------------------------
      # 步骤 4: 编译扩展（phpize -> configure -> make）
      # -----------------------------------------------------------------
      - name: Build extension
        run: |
          echo "=== 开始编译 XHCurl 扩展 ==="
          echo "PHP 版本: $(php -v | head -n 1)"

          # 运行 phpize 生成 configure 脚本
          phpize
          if [ $? -ne 0 ]; then
            echo "::error::phpize 失败"
            exit 1
          fi

          # 配置编译选项
          ./configure --enable-xhcurl
          if [ $? -ne 0 ]; then
            echo "::error::configure 失败"
            exit 1
          fi

          # 编译（使用多核加速）
          make -j$(nproc)
          if [ $? -ne 0 ]; then
            echo "::error::make 编译失败"
            exit 1
          fi

          echo "=== 编译成功 ==="

      # -----------------------------------------------------------------
      # 步骤 5: 运行测试套件
      # 使用 NO_INTERACTION=1 避免交互式提示
      # -----------------------------------------------------------------
      - name: Run test suite
        run: |
          echo "=== 开始运行测试 ==="

          # 加载扩展到当前测试环境
          export TEST_PHP_EXECUTABLE=$(which php)
          export REPORT_EXIT_STATUS=1  # 测试失败时返回非零退出码

          # 运行测试（跳过需要外部服务的测试）
          make test NO_INTERACTION=1 TESTS="-q --show-diff" || true

          echo "=== 测试完成 ==="

      # -----------------------------------------------------------------
      # 步骤 6: 收集编译产物（.so 文件）
      # 重命名为 xhcurl-linux-php{version}.so 格式，避免多版本冲突
      # -----------------------------------------------------------------
      - name: Collect build artifacts
        run: |
          mkdir -p dist/linux
          # 复制并重命名编译好的 .so 文件，加入平台和 PHP 版本信息
          for f in modules/*.so; do
            basename=$(basename "$f" .so)
            cp "$f" "dist/linux/${basename}-linux-php${{ matrix.php-version }}.so"
          done
          # 显示文件信息
          ls -la dist/linux/
          # 显示模块信息
          for f in dist/linux/*.so; do
            echo "--- $f ---"
            file "$f"
          done

      # -----------------------------------------------------------------
      # 步骤 7: 上传编译产物作为 artifact
      # -----------------------------------------------------------------
      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: xhcurl-linux-php${{ matrix.php-version }}
          path: dist/linux/*.so
          retention-days: 30  # 保留 30 天

  # =====================================================================
  # Job 2: macOS 平台编译（macOS 14 / Apple Silicon）
  # 支持 PHP 8.0 ~ 8.3
  # 注意：仅使用 macos-14（最新且 runner 资源充足），
  #       macos-13 已废弃，runner 排队时间过长
  # =====================================================================
  build-macos:
    name: "macOS (PHP ${{ matrix.php-version }}, macos-14)"
    runs-on: macos-14
    strategy:
      fail-fast: false
      matrix:
        php-version: ['8.0', '8.1', '8.2', '8.3']

    steps:
      # -----------------------------------------------------------------
      # 步骤 1: 检出代码
      # -----------------------------------------------------------------
      - name: Checkout repository
        uses: actions/checkout@v4

      # -----------------------------------------------------------------
      # 步骤 2: 安装 Homebrew 依赖（libcurl 已随系统自带）
      # 注意：跳过 brew update 以加速构建（runner 已预装最新包）
      # -----------------------------------------------------------------
      - name: Install Homebrew dependencies
        run: |
          # 仅安装缺失的构建工具，不执行 brew update（耗时过长）
          brew install autoconf automake libtool pkg-config 2>/dev/null || true

      # -----------------------------------------------------------------
      # 步骤 3: 安装 PHP
      # -----------------------------------------------------------------
      - name: Setup PHP ${{ matrix.php-version }}
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php-version }}
          tools: phpize, php-config
          extensions: curl, json
          coverage: none

      # -----------------------------------------------------------------
      # 步骤 4: 编译扩展
      # -----------------------------------------------------------------
      - name: Build extension
        run: |
          echo "=== 开始编译 XHCurl 扩展 ==="
          echo "PHP 版本: $(php -v | head -n 1)"
          echo "macOS 版本: $(sw_vers -productVersion)"

          phpize && \
          ./configure --enable-xhcurl && \
          make -j$(sysctl -n hw.ncpu)

          if [ $? -eq 0 ]; then
            echo "=== 编译成功 ==="
          else
            echo "::error::编译失败"
            exit 1
          fi

      # -----------------------------------------------------------------
      # 步骤 5: 运行测试
      # -----------------------------------------------------------------
      - name: Run test suite
        run: |
          export TEST_PHP_EXECUTABLE=$(which php)
          make test NO_INTERACTION=1 || true

      # -----------------------------------------------------------------
      # 步骤 6: 收集并上传产物（.so 文件）
      # 重命名为 xhcurl-macos-php{version}.so 格式，避免多版本冲突
      # -----------------------------------------------------------------
      - name: Collect and upload artifacts
        run: |
          mkdir -p dist/macos
          # 复制并重命名，加入平台和 PHP 版本信息
          for f in modules/*.so; do
            basename=$(basename "$f" .so)
            cp "$f" "dist/macos/${basename}-macos-php${{ matrix.php-version }}.so"
          done
          ls -la dist/macos/
          for f in dist/macos/*.so; do
            echo "--- $f ---"
            file "$f"
          done

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: xhcurl-macos-php${{ matrix.php-version }}
          path: dist/macos/*.so
          retention-days: 30

  # =====================================================================
  # Job 3: Windows 平台编译（Windows Server 2022）
  # 使用 php-sdk-binary-tools 官方工具链编译 PHP 扩展
  #
  # 重要说明：
  # - PHP 8.0 ~ 8.3 需要 Visual Studio 2019 (vs16)
  # - PHP 8.4+ 需要 Visual Studio 2022 (vs17)
  # - GitHub windows-2022 runner 仅预装 VS 2022，因此只编译 PHP 8.4
  # - 如需编译 8.0-8.3，需在 runner 上安装 VS 2019 或使用 vs16 工具集
  # =====================================================================
  build-windows:
    name: "Windows (PHP ${{ matrix.php-version }}, ${{ matrix.ts }})"
    runs-on: windows-2022
    strategy:
      fail-fast: false
      matrix:
        # 仅编译 PHP 8.4（与 runner 预装的 VS 2022 匹配）
        php-version: ['8.4']
        ts: ['nts']  # Non-Thread-Safe（FPM 推荐）

    steps:
      # -----------------------------------------------------------------
      # 步骤 1: 检出代码
      # -----------------------------------------------------------------
      - name: Checkout repository
        uses: actions/checkout@v4

      # -----------------------------------------------------------------
      # 步骤 2: 缓存 PHP SDK binary tools
      # 避免每次都从 GitHub 下载（约 100MB）
      # -----------------------------------------------------------------
      - name: Cache PHP SDK
        uses: actions/cache@v4
        with:
          path: C:\php-sdk
          key: php-sdk-binary-tools-${{ runner.os }}-v2

      # -----------------------------------------------------------------
      # 步骤 3: 安装 PHP SDK binary tools
      # 官方工具链，提供 phpsdk_setvars.bat（设置 MSVC + PHP_SDK_VS 环境变量）
      # 仓库：https://github.com/php/php-sdk-binary-tools
      #
      # 关键：phpsdk_setvars.bat 会设置 PHP_SDK_VS 环境变量（如 vs17），
      # configure.js 依赖此变量判断编译器兼容性。
      # ilammy/msvc-dev-cmd 不会设置此变量，导致 "Incompatible binary tools version" 错误。
      # -----------------------------------------------------------------
      - name: Setup PHP SDK binary tools
        shell: pwsh
        run: |
          # 若缓存命中则跳过下载
          if (Test-Path "C:\php-sdk\phpsdk-binary-tools\phpsdk_setvars.bat") {
            Write-Host "PHP SDK 已缓存，跳过下载"
            return
          }

          New-Item -ItemType Directory -Path "C:\php-sdk" -Force | Out-Null
          Set-Location "C:\php-sdk"

          # 下载官方 PHP SDK binary tools
          $sdkUrl = "https://github.com/php/php-sdk-binary-tools/archive/refs/heads/master.zip"
          Write-Host "Downloading PHP SDK binary tools: $sdkUrl"
          Invoke-WebRequest -Uri $sdkUrl -OutFile "phpsdk.zip"
          Expand-Archive -Path "phpsdk.zip" -DestinationPath "." -Force
          # 重命名为标准名称
          Rename-Item -Path "php-sdk-binary-tools-master" -NewName "phpsdk-binary-tools"

          # 验证关键文件存在
          if (-not (Test-Path "C:\php-sdk\phpsdk-binary-tools\phpsdk_setvars.bat")) {
            echo "::error::phpsdk_setvars.bat 未找到"
            Get-ChildItem -Path "C:\php-sdk\phpsdk-binary-tools" -Recurse -Filter "*.bat" | ForEach-Object { Write-Host $_.FullName }
            exit 1
          }

          Write-Host "PHP SDK 安装成功"
          Get-ChildItem -Path "C:\php-sdk\phpsdk-binary-tools" -Filter "*.bat" | ForEach-Object { Write-Host "  $($_.Name)" }

      # -----------------------------------------------------------------
      # 步骤 4: 下载 PHP 源码和 devel pack
      # Windows 编译需要 PHP 源码树（包含 config.w32、build 脚本等）
      # -----------------------------------------------------------------
      - name: Download PHP source and devel pack
        shell: pwsh
        run: |
          $phpVersion = "${{ matrix.php-version }}"
          $ts = "${{ matrix.ts }}"

          # 补全完整版本号（使用 windows.php.net 实际可用的最新版本）
          $fullVersion = switch ($phpVersion) {
            "8.4" { "8.4.22" }  # PHP 8.4 最新版本
            default { $phpVersion }
          }
          Write-Host "PHP 完整版本号: $fullVersion"

          # 确定 Visual C++ 版本标识
          # PHP 8.0 ~ 8.3 使用 vs16（Visual Studio 2019）
          # PHP 8.4+ 使用 vs17（Visual Studio 2022）
          $vc = if ($phpVersion -ge "8.4") { "vs17" } else { "vs16" }
          Write-Host "Visual C++ 版本: $vc"

          # PHP 源码 URL（GitHub 官方仓库的 tag，使用完整版本号）
          $sourceUrl = "https://github.com/php/php-src/archive/refs/tags/php-$fullVersion.zip"

          # PHP devel pack URL（包含头文件和导入库）
          # 正确格式：php-devel-pack-{version}-Win32-{vc}-x64.zip
          # 注意：devel pack 不区分 nts/ts，文件名中包含 "Win32"
          $develBaseUrl = "https://downloads.php.net/~windows/releases"
          $develFileName = "php-devel-pack-$fullVersion-Win32-$vc-x64.zip"
          $develUrl = "$develBaseUrl/$develFileName"

          # 备用 URL（windows.php.net 镜像）
          $develUrlFallback1 = "https://windows.php.net/downloads/releases/$develFileName"
          # 归档目录（旧版本可能在此）
          $develUrlFallback2 = "https://windows.php.net/downloads/releases/archives/$develFileName"

          Write-Host "Downloading PHP source: $sourceUrl"
          try {
            Invoke-WebRequest -Uri $sourceUrl -OutFile "php-src.zip" -ErrorAction Stop
          } catch {
            Write-Host "::warning::GitHub 源码下载失败，尝试 museum.php.net"
            $archiveSourceUrl = "https://museum.php.net/php-src/php-$fullVersion.zip"
            Invoke-WebRequest -Uri $archiveSourceUrl -OutFile "php-src.zip"
          }

          Write-Host "Downloading PHP devel pack: $develUrl"
          $develDownloaded = $false
          foreach ($url in @($develUrl, $develUrlFallback1, $develUrlFallback2)) {
            try {
              Write-Host "尝试下载: $url"
              Invoke-WebRequest -Uri $url -OutFile "php-devel.zip" -ErrorAction Stop
              $develDownloaded = $true
              Write-Host "下载成功: $url"
              break
            } catch {
              Write-Host "::warning::下载失败: $url - $($_.Exception.Message)"
            }
          }

          if (-not $develDownloaded) {
            echo "::error::所有 devel pack 下载 URL 均失败"
            echo "::error::请检查版本号 $fullVersion 和 VC 版本 $vc 是否正确"
            echo "::error::可访问 https://windows.php.net/download/ 查看可用版本"
            exit 1
          }

          # 解压 PHP 源码
          Expand-Archive -Path "php-src.zip" -DestinationPath "C:\php-src" -Force
          # 源码目录名形如 php-src-php-8.4.22，重命名为标准名
          $srcDir = Get-ChildItem -Path "C:\php-src" -Directory | Select-Object -First 1
          Rename-Item -Path $srcDir.FullName -NewName "php-src"
          Write-Host "PHP 源码目录: C:\php-src\php-src"

          # 解压 devel pack 到 PHP 源码目录（提供 phpsdk 库和头文件）
          Expand-Archive -Path "php-devel.zip" -DestinationPath "C:\php-devel" -Force
          $develDir = Get-ChildItem -Path "C:\php-devel" -Directory | Select-Object -First 1
          Write-Host "PHP devel 目录: $($develDir.FullName)"

          # 将 devel pack 内容合并到 PHP 源码目录
          Copy-Item -Path "$($develDir.FullName)\*" -Destination "C:\php-src\php-src" -Recurse -Force

          # 设置环境变量供后续步骤使用
          echo "PHP_SRC_DIR=C:\php-src\php-src" >> $env:GITHUB_ENV
          echo "PHP_VC=$vc" >> $env:GITHUB_ENV

      # -----------------------------------------------------------------
      # 步骤 5: 复制扩展源码到 PHP 源码树
      # PHP Windows 编译要求扩展位于 php-src/ext/<extname> 目录下
      # -----------------------------------------------------------------
      - name: Copy extension source to PHP source tree
        shell: pwsh
        run: |
          $extDir = Join-Path $env:PHP_SRC_DIR "ext\xhcurl"
          New-Item -ItemType Directory -Path $extDir -Force | Out-Null
          # 复制扩展源码和构建配置文件
          Copy-Item -Path "*.c", "*.h", "config.m4", "config.w32" -Destination $extDir -Force
          Write-Host "扩展源码已复制到: $extDir"
          Get-ChildItem -Path $extDir | Format-Table Name, Length

      # -----------------------------------------------------------------
      # 步骤 6: 编译扩展
      # 关键：必须先调用 phpsdk_setvars.bat 初始化 PHP SDK 环境
      #   - 设置 MSVC 编译器路径（cl.exe, nmake.exe, link.exe）
      #   - 设置 PHP_SDK_VS 环境变量（如 vs17），configure.js 依赖此变量
      #   - 不调用会导致 "Incompatible binary tools version" 错误
      # -----------------------------------------------------------------
      - name: Build extension
        shell: cmd
        run: |
          REM ===============================================================
          REM 1. 初始化 PHP SDK 环境（设置 MSVC + PHP_SDK_VS=vs17）
          REM ===============================================================
          echo === 初始化 PHP SDK 环境 ===
          call "C:\php-sdk\phpsdk-binary-tools\phpsdk_setvars.bat" vs17 x64
          if errorlevel 1 (
            echo ::error::phpsdk_setvars.bat 初始化失败
            exit /b 1
          )

          REM 验证环境变量
          echo PHP_SDK_VS=%PHP_SDK_VS%
          echo PHP_SDK_ARCH=%PHP_SDK_ARCH%

          REM ===============================================================
          REM 2. 进入 PHP 源码目录
          REM ===============================================================
          cd /d "%PHP_SRC_DIR%"

          REM 验证 MSVC 环境
          echo === MSVC 环境检查 ===
          where cl.exe
          where nmake.exe

          REM 验证 PHP 源码结构
          echo === PHP 源码结构 ===
          dir /b buildconf.bat 2>nul
          dir /b ext\xhcurl\*.c 2>nul

          REM ===============================================================
          REM 3. 生成 configure 脚本
          REM ===============================================================
          echo === 运行 buildconf.bat ===
          call buildconf.bat --force < NUL
          if errorlevel 1 (
            echo ::error::buildconf 失败
            exit /b 1
          )

          if not exist configure.js (
            echo ::error::configure.js 未生成
            exit /b 1
          )

          REM ===============================================================
          REM 4. 配置：--enable-xhcurl=shared 生成独立 .dll
          REM    configure.js 是 JScript 文件，必须用 cscript 运行
          REM ===============================================================
          echo === 运行 configure.js ===
          cscript //nologo configure.js --enable-xhcurl=shared --disable-all --enable-json --with-curl --enable-cli --enable-cgi
          if errorlevel 1 (
            echo ::error::configure 失败
            type configure.log 2>nul
            exit /b 1
          )

          REM ===============================================================
          REM 5. 编译
          REM ===============================================================
          echo === 运行 nmake ===
          nmake /NOLOGO
          if errorlevel 1 (
            echo ::error::nmake 编译失败
            exit /b 1
          )

          echo === Windows 编译成功 ===
          dir /s /b php_xhcurl.dll 2>nul

      # -----------------------------------------------------------------
      # 步骤 7: 收集编译产物（.dll 文件）
      # 重命名为 xhcurl-windows-php{version}-{ts}.dll 格式
      # -----------------------------------------------------------------
      - name: Collect build artifacts
        shell: pwsh
        run: |
          $distDir = "dist\windows"
          New-Item -ItemType Directory -Path $distDir -Force | Out-Null

          # 在 Release_TS 或 Release 目录下查找生成的 .dll
          $searchDirs = @(
            Join-Path $env:PHP_SRC_DIR "Release_TS"
            Join-Path $env:PHP_SRC_DIR "Release"
            Join-Path $env:PHP_SRC_DIR "x64\Release_TS"
            Join-Path $env:PHP_SRC_DIR "x64\Release"
          )

          $dllFound = $false
          foreach ($dir in $searchDirs) {
            if (Test-Path $dir) {
              $dll = Get-ChildItem -Path $dir -Filter "php_xhcurl.dll" -ErrorAction SilentlyContinue
              if ($dll) {
                # 重命名为包含平台和版本信息的文件名
                $newName = "xhcurl-windows-php${{ matrix.php-version }}-${{ matrix.ts }}.dll"
                Copy-Item -Path $dll.FullName -Destination (Join-Path $distDir $newName)
                Write-Host "Found: $($dll.FullName) -> $newName"
                $dllFound = $true

                # 同时复制 .pdb 符号文件（用于调试）
                $pdb = Get-ChildItem -Path $dir -Filter "php_xhcurl.pdb" -ErrorAction SilentlyContinue
                if ($pdb) {
                  Copy-Item -Path $pdb.FullName -Destination $distDir
                }
                break
              }
            }
          }

          if (-not $dllFound) {
            echo "::error::未找到编译产物 php_xhcurl.dll"
            echo "::error::搜索目录:"
            $searchDirs | ForEach-Object { echo "  $_" }
            exit 1
          }

          Write-Host "=== dist\windows 内容 ==="
          Get-ChildItem -Path $distDir | Format-Table Name, Length

      # -----------------------------------------------------------------
      # 步骤 8: 上传编译产物
      # -----------------------------------------------------------------
      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: xhcurl-windows-php${{ matrix.php-version }}-${{ matrix.ts }}
          path: dist/windows/*
          retention-days: 30

  # =====================================================================
  # Job 4: 发布 Release（仅在 push tag 时触发）
  # 将所有平台的编译产物打包成 GitHub Release 附件
  # =====================================================================
  release:
    name: "Create Release"
    needs: [build-linux, build-macos, build-windows]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      # -----------------------------------------------------------------
      # 步骤 1: 下载所有平台的编译产物
      # -----------------------------------------------------------------
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: all-builds
          merge-multiple: true

      # -----------------------------------------------------------------
      # 步骤 2: 打包所有平台产物并生成校验和
      # 注意：只对二进制文件（.so/.dll）生成校验和，避免递归包含 .txt 文件
      # -----------------------------------------------------------------
      - name: Package releases
        run: |
          mkdir -p release

          echo "=== all-builds 目录结构 ==="
          find all-builds -type f | sort

          # 递归查找所有 .so 和 .dll 文件并移动到 release 目录
          # download-artifact 配置 merge-multiple 后，文件可能分布在子目录中
          find all-builds -type f \( -name "*.so" -o -name "*.dll" \) -exec cp {} release/ \;

          # 显示最终打包内容
          echo "=== Release 内容 ==="
          ls -la release/

          # 统计二进制文件数量
          binary_count=$(find release -type f \( -name "*.so" -o -name "*.dll" \) | wc -l)
          echo "Binary files count: $binary_count"

          if [ "$binary_count" -eq 0 ]; then
            echo "::error::没有找到任何编译产物，无法发布 Release"
            echo "::error::请检查 build-linux 和 build-macos 任务是否成功上传 artifact"
            exit 1
          fi

          # 只对二进制文件生成校验和（避免递归包含 .txt 文件）
          cd release
          # 使用 find 精确匹配二进制文件，排除 .txt 校验和文件
          find . -type f \( -name "*.so" -o -name "*.dll" \) -exec sha256sum {} + > SHA256SUMS.txt
          find . -type f \( -name "*.so" -o -name "*.dll" \) -exec md5sum {} + > MD5SUMS.txt

          # 验证校验和文件非空
          echo "=== SHA256SUMS.txt 内容 ==="
          cat SHA256SUMS.txt
          echo "=== MD5SUMS.txt 内容 ==="
          cat MD5SUMS.txt

          # 确保校验和文件非空（防止 422 上传错误）
          if [ ! -s SHA256SUMS.txt ]; then
            echo "::error::SHA256SUMS.txt 为空"
            exit 1
          fi
          if [ ! -s MD5SUMS.txt ]; then
            echo "::error::MD5SUMS.txt 为空"
            exit 1
          fi

      # -----------------------------------------------------------------
      # 步骤 3: 创建 GitHub Release
      # 使用 @v2 版本（基于 Node 24，避免 Node 20 废弃警告）
      # -----------------------------------------------------------------
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: release/*
          draft: false
          prerelease: false
          generate_release_notes: true
          name: Release ${{ github.ref_name }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # =====================================================================
  # Job 5: 代码质量检查（可选）
  # 使用 cppcheck 进行静态分析
  # =====================================================================
  lint:
    name: "Code Quality Check"
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install cppcheck
        run: sudo apt-get install -y cppcheck

      - name: Run static analysis
        run: |
          echo "=== 运行静态代码分析 ==="
          cppcheck --enable=all --std=c11 \
            --suppress=missingIncludeSystem \
            --error-exitcode=1 \
            *.c 2>&1 || true
          echo "=== 分析完成 ==="
