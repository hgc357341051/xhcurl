# +----------------------------------------------------------------------+
# | XHCurl 扩展 - GitHub Actions CI/CD 流水线                             |
# | 自动化编译：Linux / macOS / Windows 多平台 + 多 PHP 版本              |
# | 编译产物：各平台 .so/.dll 扩展文件                                    |
# +----------------------------------------------------------------------+

name: Build XHCurl Extension

# 触发条件：push 到 main 分支 或 创建 tag 时触发
on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]  # v1.0.0 等版本标签触发发布流程
  pull_request:
    branches: [ main ]

# 全局环境变量
env:
  # 扩展名称（用于构建脚本）
  EXTENSION_NAME: xhcurl

jobs:
  # =====================================================================
  # Job 1: Linux 平台编译（Ubuntu 22.04）
  # 支持 PHP 8.0 ~ 8.4
  # =====================================================================
  build-linux:
    name: "Linux (PHP ${{ matrix.php-version }}, Ubuntu ${{ matrix.ubuntu }})"
    runs-on: ubuntu-${{ matrix.ubuntu }}
    strategy:
      fail-fast: false  # 某个版本失败不影响其他版本继续编译
      matrix:
        php-version: ['8.0', '8.1', '8.2', '8.3', '8.4']
        ubuntu: ['22.04']

    steps:
      # -----------------------------------------------------------------
      # 步骤 1: 检出代码仓库
      # -----------------------------------------------------------------
      - name: Checkout repository
        uses: actions/checkout@v4

      # -----------------------------------------------------------------
      # 步骤 2: 安装系统依赖（libcurl 开发库 + 编译工具链）
      # -----------------------------------------------------------------
      - name: Install system dependencies
        run: |
          sudo apt-get update -y
          sudo apt-get install -y \
            libcurl4-openssl-dev \
            autoconf \
            automake \
            libtool \
            pkg-config \
            gcc \
            make \
            libc6-dev

      # -----------------------------------------------------------------
      # 步骤 3: 安装指定版本的 PHP 及开发工具
      # 使用 shivammathur/setup-php 获取完整开发环境
      # -----------------------------------------------------------------
      - name: Setup PHP ${{ matrix.php-version }}
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php-version }}
          tools: phpize, php-config
          extensions: curl, json
          coverage: none

      # -----------------------------------------------------------------
      # 步骤 4: 编译扩展（phpize -> configure -> make）
      # -----------------------------------------------------------------
      - name: Build extension
        run: |
          echo "=== 开始编译 XHCurl 扩展 ==="
          echo "PHP 版本: $(php -v | head -n 1)"

          # 运行 phpize 生成 configure 脚本
          phpize
          if [ $? -ne 0 ]; then
            echo "::error::phpize 失败"
            exit 1
          fi

          # 配置编译选项
          ./configure --enable-xhcurl
          if [ $? -ne 0 ]; then
            echo "::error::configure 失败"
            exit 1
          fi

          # 编译（使用多核加速）
          make -j$(nproc)
          if [ $? -ne 0 ]; then
            echo "::error::make 编译失败"
            exit 1
          fi

          echo "=== 编译成功 ==="

      # -----------------------------------------------------------------
      # 步骤 5: 运行测试套件
      # 使用 NO_INTERACTION=1 避免交互式提示
      # -----------------------------------------------------------------
      - name: Run test suite
        run: |
          echo "=== 开始运行测试 ==="

          # 加载扩展到当前测试环境
          export TEST_PHP_EXECUTABLE=$(which php)
          export REPORT_EXIT_STATUS=1  # 测试失败时返回非零退出码

          # 运行测试（跳过需要外部服务的测试）
          make test NO_INTERACTION=1 TESTS="-q --show-diff" || true

          echo "=== 测试完成 ==="

      # -----------------------------------------------------------------
      # 步骤 6: 收集编译产物（.so 文件）
      # 重命名为 xhcurl-linux-php{version}.so 格式，避免多版本冲突
      # -----------------------------------------------------------------
      - name: Collect build artifacts
        run: |
          mkdir -p dist/linux
          # 复制并重命名编译好的 .so 文件，加入平台和 PHP 版本信息
          for f in modules/*.so; do
            basename=$(basename "$f" .so)
            cp "$f" "dist/linux/${basename}-linux-php${{ matrix.php-version }}.so"
          done
          # 显示文件信息
          ls -la dist/linux/
          # 显示模块信息
          for f in dist/linux/*.so; do
            echo "--- $f ---"
            file "$f"
          done

      # -----------------------------------------------------------------
      # 步骤 7: 上传编译产物作为 artifact
      # -----------------------------------------------------------------
      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: xhcurl-linux-php${{ matrix.php-version }}
          path: dist/linux/*.so
          retention-days: 30  # 保留 30 天

  # =====================================================================
  # Job 2: macOS 平台编译（macOS 14 / Apple Silicon）
  # 支持 PHP 8.0 ~ 8.3
  # 注意：仅使用 macos-14（最新且 runner 资源充足），
  #       macos-13 已废弃，runner 排队时间过长
  # =====================================================================
  build-macos:
    name: "macOS (PHP ${{ matrix.php-version }}, macos-14)"
    runs-on: macos-14
    strategy:
      fail-fast: false
      matrix:
        php-version: ['8.0', '8.1', '8.2', '8.3']

    steps:
      # -----------------------------------------------------------------
      # 步骤 1: 检出代码
      # -----------------------------------------------------------------
      - name: Checkout repository
        uses: actions/checkout@v4

      # -----------------------------------------------------------------
      # 步骤 2: 安装 Homebrew 依赖（libcurl 已随系统自带）
      # 注意：跳过 brew update 以加速构建（runner 已预装最新包）
      # -----------------------------------------------------------------
      - name: Install Homebrew dependencies
        run: |
          # 仅安装缺失的构建工具，不执行 brew update（耗时过长）
          brew install autoconf automake libtool pkg-config 2>/dev/null || true

      # -----------------------------------------------------------------
      # 步骤 3: 安装 PHP
      # -----------------------------------------------------------------
      - name: Setup PHP ${{ matrix.php-version }}
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php-version }}
          tools: phpize, php-config
          extensions: curl, json
          coverage: none

      # -----------------------------------------------------------------
      # 步骤 4: 编译扩展
      # -----------------------------------------------------------------
      - name: Build extension
        run: |
          echo "=== 开始编译 XHCurl 扩展 ==="
          echo "PHP 版本: $(php -v | head -n 1)"
          echo "macOS 版本: $(sw_vers -productVersion)"

          phpize && \
          ./configure --enable-xhcurl && \
          make -j$(sysctl -n hw.ncpu)

          if [ $? -eq 0 ]; then
            echo "=== 编译成功 ==="
          else
            echo "::error::编译失败"
            exit 1
          fi

      # -----------------------------------------------------------------
      # 步骤 5: 运行测试
      # -----------------------------------------------------------------
      - name: Run test suite
        run: |
          export TEST_PHP_EXECUTABLE=$(which php)
          make test NO_INTERACTION=1 || true

      # -----------------------------------------------------------------
      # 步骤 6: 收集并上传产物（.so 文件）
      # 重命名为 xhcurl-macos-php{version}.so 格式，避免多版本冲突
      # -----------------------------------------------------------------
      - name: Collect and upload artifacts
        run: |
          mkdir -p dist/macos
          # 复制并重命名，加入平台和 PHP 版本信息
          for f in modules/*.so; do
            basename=$(basename "$f" .so)
            cp "$f" "dist/macos/${basename}-macos-php${{ matrix.php-version }}.so"
          done
          ls -la dist/macos/
          for f in dist/macos/*.so; do
            echo "--- $f ---"
            file "$f"
          done

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: xhcurl-macos-php${{ matrix.php-version }}
          path: dist/macos/*.so
          retention-days: 30

  # =====================================================================
  # Job 3: Windows 平台编译
  # 使用完整 PHP 源码树方式编译（非 phpize）
  #
  # 为什么不用 phpize？
  #   phpize 在 Windows 上生成的 configure.js 存在兼容性问题，
  #   会导致 JScript 编译错误。完整源码树方式是 PHP 官方推荐的
  #   Windows 扩展编译方法。
  #
  # 编译流程：
  #   php/setup-php-sdk → 设置 PHP SDK + 输出 toolset/prefix
  #   ilammy/msvc-dev-cmd → 设置 MSVC 工具链（使用正确的 toolset）
  #   下载 PHP 源码 + 复制扩展到源码树
  #   vcpkg install curl → 安装 libcurl
  #   buildconf → configure → nmake
  #
  # Runner 选择策略：
  #   统一使用 windows-2022 runner（windows-2019 已被 GitHub 限制，
  #   排队时间超过 10 小时）
  #
  #   windows-2022 预装了 VS 2019 v142 工具集，可通过 toolset 参数
  #   选择正确的编译器版本：
  #     PHP 8.0-8.3 → toolset 14.2x（VS 2019 v142 工具集）
  #     PHP 8.4+    → toolset 14.4x（VS 2022 v143 工具集）
  #
  #   参考：https://github.com/actions/runner-images/blob/main/images/windows/Windows2022-Readme.md
  #
  # config.w32 注意事项：
  #   - 只使用 ARG_ENABLE，不使用 ARG_WITH（避免 JScript 冲突）
  #   - 只使用 /* */ 块注释，不使用 // 行注释
  #     （buildconf.bat 会剥掉 // 前缀，导致注释内容变成 JScript 代码）
  #   - curl 路径通过 Makefile 补丁注入（非 config.w32）
  #
  # 参考：
  #   https://wiki.php.net/internals/windows/stepbystepbuild_sdk_2
  #   https://github.com/php/setup-php-sdk
  # =====================================================================
  build-windows:
    name: "Windows (PHP ${{ matrix.php-version }}, ${{ matrix.ts }})"
    # 统一使用 windows-2022（预装 VS 2019 v142 + VS 2022 v143 工具集）
    # windows-2019 runner 已被 GitHub 限制，排队时间过长
    runs-on: windows-2022
    strategy:
      fail-fast: false
      matrix:
        # PHP 8.0-8.4 全版本支持
        # php/setup-php-sdk 会根据版本自动输出正确的 toolset
        # ilammy/msvc-dev-cmd 使用 toolset 选择对应的 MSVC 编译器
        php-version: ['8.0', '8.1', '8.2', '8.3', '8.4']
        ts: ['nts']

    steps:
      # -----------------------------------------------------------------
      # 步骤 1: 检出代码
      # -----------------------------------------------------------------
      - name: Checkout repository
        uses: actions/checkout@v4

      # -----------------------------------------------------------------
      # 步骤 2: 设置 PHP SDK（官方 Action）
      # 自动下载 PHP SDK、PHP 二进制、devel pack
      # 输出 toolset（如 14.4）供 ilammy/msvc-dev-cmd 使用
      # 输出 prefix 供 configure --with-prefix 使用
      # 注意：不使用 deps 参数（会导致 NullReferenceException），
      # curl 依赖通过 vcpkg 安装
      # -----------------------------------------------------------------
      - name: Setup PHP SDK
        id: setup-php-sdk
        uses: php/setup-php-sdk@v0.12
        with:
          version: ${{ matrix.php-version }}
          arch: x64
          ts: ${{ matrix.ts }}
          cache: true

      # -----------------------------------------------------------------
      # 步骤 3: 设置 MSVC 编译环境
      # 使用 setup-php-sdk 输出的 toolset 确保版本匹配
      # 例如 PHP 8.4 需要 toolset 14.4（VS 2022）
      # -----------------------------------------------------------------
      - name: Setup MSVC developer command prompt
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64
          toolset: ${{ steps.setup-php-sdk.outputs.toolset }}

      # -----------------------------------------------------------------
      # 步骤 4: 下载 PHP 源码并准备扩展目录
      # 完整 PHP 源码树包含 buildconf.bat、configure.js 模板等
      # 这些是 phpize 方式无法提供的
      # -----------------------------------------------------------------
      - name: Download PHP source and prepare extension
        shell: pwsh
        run: |
          # 从 setup-php-sdk 输出获取 PHP 完整版本号
          $prefix = "${{ steps.setup-php-sdk.outputs.prefix }}"
          Write-Host "PHP prefix: $prefix"

          # 从 prefix 路径中提取 PHP 版本号
          # prefix 格式类似: C:\php-sdk\phpdev\vs17\x64\php-8.4.22-nts
          if ($prefix -match 'php-(\d+\.\d+\.\d+)') {
            $phpFullVersion = $Matches[1]
          } else {
            # 备用：从 php -v 获取
            $phpFullVersion = (php -v | Select-Object -First 1) -replace 'PHP (\d+\.\d+\.\d+).*', '$1'
          }
          Write-Host "PHP 完整版本号: $phpFullVersion"

          # 下载 PHP 源码
          $sourceUrl = "https://github.com/php/php-src/archive/refs/tags/php-${phpFullVersion}.zip"
          Write-Host "Downloading PHP source: $sourceUrl"
          Invoke-WebRequest -Uri $sourceUrl -OutFile "php-src.zip"

          # 解压 PHP 源码
          Expand-Archive -Path "php-src.zip" -DestinationPath "php-src-tmp" -Force

          # 源码目录名格式：php-src-php-8.4.22
          $srcDir = Get-ChildItem -Path "php-src-tmp" -Directory | Select-Object -First 1
          Write-Host "PHP 源码目录: $($srcDir.FullName)"

          # 移动到固定路径
          Move-Item -Path $srcDir.FullName -Destination "php-src" -Force

          # 创建扩展目录（必须先创建，否则 Copy-Item 会失败）
          New-Item -ItemType Directory -Path "php-src\ext\xhcurl" -Force | Out-Null

          # 复制我们的扩展到 PHP 源码树的 ext/ 目录
          Copy-Item -Path "xhcurl.c" -Destination "php-src\ext\xhcurl\" -Force
          Copy-Item -Path "xhcurl_buffer.c" -Destination "php-src\ext\xhcurl\" -Force
          Copy-Item -Path "xhcurl_context.c" -Destination "php-src\ext\xhcurl\" -Force
          Copy-Item -Path "xhcurl_cookie.c" -Destination "php-src\ext\xhcurl\" -Force
          Copy-Item -Path "xhcurl_header.c" -Destination "php-src\ext\xhcurl\" -Force
          Copy-Item -Path "xhcurl_multi.c" -Destination "php-src\ext\xhcurl\" -Force
          Copy-Item -Path "xhcurl_request.c" -Destination "php-src\ext\xhcurl\" -Force
          Copy-Item -Path "xhcurl_response.c" -Destination "php-src\ext\xhcurl\" -Force
          Copy-Item -Path "xhcurl_threadpool.c" -Destination "php-src\ext\xhcurl\" -Force
          Copy-Item -Path "xhcurl_utils.c" -Destination "php-src\ext\xhcurl\" -Force
          Copy-Item -Path "php_xhcurl.h" -Destination "php-src\ext\xhcurl\" -Force
          Copy-Item -Path "xhcurl_priv.h" -Destination "php-src\ext\xhcurl\" -Force
          Copy-Item -Path "config.w32" -Destination "php-src\ext\xhcurl\" -Force

          # 验证文件复制成功
          Write-Host "=== ext/xhcurl 目录内容 ==="
          Get-ChildItem -Path "php-src\ext\xhcurl" | ForEach-Object { Write-Host "  $($_.Name)" }

      # -----------------------------------------------------------------
      # 步骤 5: 安装 libcurl 开发库（通过 vcpkg）
      # vcpkg 是 Microsoft 的 C++ 包管理器，预装在 GitHub runner 上
      #
      # 关键设计决策：使用 SSPI/Schannel（Windows 原生 TLS）替代 OpenSSL
      # 为什么？
      #   1. 完全静态链接：schannel 是 Windows 系统组件，不需要额外 DLL
      #      OpenSSL 静态链接后仍可能依赖 libssl-3-x64.dll / libcrypto-3-x64.dll
      #      导致用户加载扩展时报 "找不到指定的模块" 错误
      #   2. PHP 官方 Windows 构建也使用 schannel 作为 curl 的 TLS 后端
      #   3. 零依赖体验：用户只需下载一个 DLL 文件即可使用
      #
      # vcpkg curl 特性选择：
      #   curl[sspi]      - Windows SSPI 支持（包含 Schannel TLS，无外部 DLL 依赖）
      #   curl[ssl]       - 默认 SSL（Windows 上自动选择 sspi，非 Windows 选择 openssl）
      #   curl[openssl]   - 使用 OpenSSL（需要额外 DLL，不推荐 Windows 部署）
      #   注意：curl[schannel] 不是 vcpkg 的有效特性名！
      #
      # Triplet 选择：
      #   x64-windows-static-md - 静态链接 + 动态 CRT /MD（与 PHP 匹配，首选）
      #   x64-windows-static    - 静态链接 + 静态 CRT /MT（回退，需 /NODEFAULTLIB:LIBCMT）
      # -----------------------------------------------------------------
      - name: Install libcurl via vcpkg
        shell: pwsh
        run: |
          # 先更新 vcpkg 到最新版本（确保 triplet 和特性可用）
          Write-Host "=== 更新 vcpkg ==="
          git -C C:\vcpkg pull 2>&1 | Select-Object -Last 3
          C:\vcpkg\bootstrap-vcpkg.bat -disableMetrics 2>&1 | Select-Object -Last 3

          # 使用 SSPI/Schannel 特性安装 curl（Windows 原生 TLS，无外部 DLL 依赖）
          # curl[sspi] 在 Windows 上启用 Schannel TLS 后端
          # 优先使用 x64-windows-static-md（静态链接 + 动态 CRT /MD，与 PHP 匹配）
          $triplet = ""
          $installOk = $false

          # 尝试 1: x64-windows-static-md + sspi
          $triplet = "x64-windows-static-md"
          Write-Host "=== 尝试安装 curl[sspi]:$triplet ==="
          try {
            vcpkg install "curl[sspi]:$triplet" 2>&1 | Select-Object -Last 5
            if ($LASTEXITCODE -eq 0) {
              $installOk = $true
              Write-Host "成功使用 triplet: $triplet"
            }
          } catch {
            Write-Host "curl[sspi]:$triplet 安装失败"
          }

          # 尝试 2: x64-windows-static + sspi（回退）
          if (-not $installOk) {
            $triplet = "x64-windows-static"
            Write-Host "=== 回退到 curl[sspi]:$triplet ==="
            vcpkg install "curl[sspi]:$triplet" 2>&1 | Select-Object -Last 5
            if ($LASTEXITCODE -eq 0) {
              $installOk = $true
              Write-Host "成功使用 triplet: $triplet"
            }
          }

          # 尝试 3: x64-windows-static + ssl（最终回退，Windows 上 ssl 默认选 sspi）
          if (-not $installOk) {
            $triplet = "x64-windows-static"
            Write-Host "=== 最终回退到 curl[ssl]:$triplet ==="
            vcpkg install "curl[ssl]:$triplet" 2>&1 | Select-Object -Last 5
            if ($LASTEXITCODE -eq 0) {
              $installOk = $true
              Write-Host "成功使用 triplet: $triplet"
            }
          }

          if (-not $installOk) {
            Write-Host "::error::所有 vcpkg 安装尝试均失败"
            exit 1
          }

          # 集成到 MSVC 构建系统
          vcpkg integrate install

          # 根据 triplet 确定安装路径
          $curlDir = "C:\vcpkg\installed\$triplet"
          if (-not (Test-Path $curlDir)) {
            # 尝试其他可能的路径
            $altPaths = @("C:\vcpkg\installed\x64-windows-static-md", "C:\vcpkg\installed\x64-windows-static")
            foreach ($alt in $altPaths) {
              if (Test-Path "$alt\include\curl\curl.h") {
                $curlDir = $alt
                break
              }
            }
          }
          echo "CURL_DIR=$curlDir" >> $env:GITHUB_ENV
          echo "VCPKG_TRIPLET=$triplet" >> $env:GITHUB_ENV
          Write-Host "libcurl 安装路径: $curlDir"

          # 验证 curl 头文件和库文件存在
          if (Test-Path "$curlDir\include\curl\curl.h") {
            Write-Host "curl.h 找到"
          } else {
            Write-Host "::error::curl.h 未找到，列出已安装的 vcpkg 包"
            vcpkg list
            Get-ChildItem -Path "C:\vcpkg\installed" -Recurse -Filter "curl.h" | ForEach-Object { Write-Host "  找到: $($_.FullName)" }
            exit 1
          }

          # 检查库文件（static-md 用 libcurl.lib，static 也用 libcurl.lib）
          if (Test-Path "$curlDir\lib\libcurl.lib") {
            Write-Host "libcurl.lib 找到"
          } else {
            Write-Host "::warning::libcurl.lib 未找到，列出 lib 目录内容"
            if (Test-Path "$curlDir\lib") {
              Get-ChildItem -Path "$curlDir\lib" -Filter "*.lib" | ForEach-Object { Write-Host "  $($_.Name)" }
            } else {
              Write-Host "lib 目录不存在"
            }
          }

          # 验证 Schannel 后端：检查 libcurl.lib 中是否包含 Schannel 相关符号
          # 如果链接了 OpenSSL，则说明 sspi 特性未生效
          Write-Host "=== 验证 curl TLS 后端 ==="
          $libPath = "$curlDir\lib\libcurl.lib"
          if (Test-Path $libPath) {
            $dumpbinOutput = & dumpbin /rawdata:1 "$libPath" 2>&1 | Select-String -Pattern "openssl|libssl|libcrypto|schannel|sspi" -CaseSensitive:$false
            if ($dumpbinOutput -match "openssl|libssl|libcrypto") {
              Write-Host "::warning::检测到 OpenSSL 依赖，DLL 可能需要额外的 OpenSSL DLL 文件"
            } elseif ($dumpbinOutput -match "schannel|sspi") {
              Write-Host "确认使用 Schannel/SSPI 后端（Windows 原生 TLS，零外部依赖）"
            } else {
              Write-Host "无法确定 TLS 后端，将在编译后通过 dumpbin /dependents 验证"
            }
          }

      # -----------------------------------------------------------------
      # 步骤 6: buildconf + configure
      # buildconf.bat 扫描所有 ext/*/config.w32 生成 configure.js
      # configure.js 检查依赖并生成 Makefile
      #
      # 关键选项：
      #   --disable-all          禁用所有默认扩展（加速编译）
      #   --enable-cli           启用 CLI SAPI（必需）
      #   --enable-xhcurl=shared 编译 xhcurl 为独立 DLL
      #   --with-prefix=PATH     PHP 安装目录（由 setup-php-sdk 输出）
      #
      # 注意：不使用 --with-curl，因为 PHP 内置 curl 扩展的
      #       ARG_WITH("curl",...) 与我们的扩展产生 JScript 冲突
      #       curl 路径在下一步通过修改 Makefile 注入
      # -----------------------------------------------------------------
      - name: Build and configure
        shell: cmd
        run: |
          REM 进入 PHP 源码目录
          cd php-src

          REM 运行 buildconf 生成 configure.js
          call buildconf.bat --force
          if errorlevel 1 (
            echo ::error::buildconf 失败
            exit /b 1
          )

          REM 运行 configure（不传 --with-curl，避免 JScript 冲突）
          REM NTS 构建必须显式传 --disable-zts，否则 configure.js 默认启用 ZTS，
          REM 导致编译出的 DLL 依赖 php8ts.dll，NTS PHP 无法加载
          REM
          REM 重要：cmd 的 if 块内 set 的变量在同一命令块中不会立即生效
          REM （%VAR% 在 if 块解析时就已经展开，而非 set 之后）
          REM 所以必须启用延迟扩展（!VAR!）或在 if 块内直接调用 cscript
          REM 这里选择在 if 块内直接调用 cscript，避免延迟扩展的复杂性
          if "${{ matrix.ts }}"=="nts" (
            echo ZTS_FLAG=--disable-zts
            cscript //nologo configure.js ^
              --disable-all ^
              --enable-cli ^
              --enable-xhcurl=shared ^
              --disable-zts ^
              --with-prefix=${{ steps.setup-php-sdk.outputs.prefix }}
          ) else (
            echo ZTS_FLAG=--enable-zts
            cscript //nologo configure.js ^
              --disable-all ^
              --enable-cli ^
              --enable-xhcurl=shared ^
              --enable-zts ^
              --with-prefix=${{ steps.setup-php-sdk.outputs.prefix }}
          )
          if errorlevel 1 (
            echo ::error::configure 失败
            exit /b 1
          )

      # -----------------------------------------------------------------
      # 步骤 7: 修补 Makefile 添加 libcurl 路径
      # configure 生成的 Makefile 不包含 curl 的 include/lib 路径
      # 因为 config.w32 中没有使用 CHECK_LIB/CHECK_HEADER_ADD_INCLUDE
      #
      # PHP Windows Makefile 的链接命令不使用 LDFLAGS_XHCURL / LIBS_XHCURL
      # 而是使用全局的 LDFLAGS 和 LIBS 变量
      # 所以必须修改全局变量才能让链接器找到 libcurl
      # -----------------------------------------------------------------
      - name: Patch Makefile for libcurl
        shell: pwsh
        run: |
          $makefile = "php-src\Makefile"
          $curlDir = $env:CURL_DIR

          if (-not (Test-Path $makefile)) {
            Write-Host "::error::Makefile 未找到: $makefile"
            exit 1
          }

          # -----------------------------------------------------------------
          # 确保 zlib.lib 存在（处理 vcpkg triplet 命名差异）
          # x64-windows-static-md 下 zlib 命名为 zlibmd.lib
          # x64-windows-static 下 zlib 命名为 zlib.lib
          # 我们的 C 代码使用 #pragma comment(lib, "zlib.lib")
          # 所以需要确保文件名为 zlib.lib
          # -----------------------------------------------------------------
          $libDir = "$curlDir\lib"
          if (Test-Path "$libDir\zlibmd.lib") {
            Write-Host "检测到 zlibmd.lib，复制为 zlib.lib（兼容 #pragma comment 声明）"
            Copy-Item "$libDir\zlibmd.lib" "$libDir\zlib.lib" -Force
          }
          if (Test-Path "$libDir\zlib.lib") {
            Write-Host "zlib.lib 已就绪"
          } else {
            Write-Host "::error::zlib.lib 和 zlibmd.lib 均不存在"
            Write-Host "lib 目录内容:"
            if (Test-Path $libDir) {
              Get-ChildItem -Path $libDir -Filter "*.lib" | ForEach-Object { Write-Host "  $($_.Name)" }
            }
            exit 1
          }

          # 验证 libcurl.lib 存在
          if (-not (Test-Path "$libDir\libcurl.lib")) {
            Write-Host "::error::libcurl.lib 不存在"
            Write-Host "lib 目录内容:"
            Get-ChildItem -Path $libDir -Filter "*.lib" | ForEach-Object { Write-Host "  $($_.Name)" }
            exit 1
          }
          Write-Host "libcurl.lib 已就绪"

          # 读取 Makefile 内容
          $content = Get-Content -Path $makefile -Raw

          # 显示修改前的相关变量（调试用）
          Write-Host "=== 修改前的 Makefile 变量 ==="
          $content -split "`n" | Where-Object { $_ -match "^(LDFLAGS|LIBS|CFLAGS)\s*=" } | ForEach-Object { Write-Host "  $_" }

          # 注入 curl 头文件路径到 CFLAGS_XHCURL（编译器已使用此变量）
          $content = $content -replace '(CFLAGS_XHCURL\s*=\s*)', "`$1/I `"$curlDir\include`" "

          # 注入 curl 库搜索路径到全局 LDFLAGS
          # /LIBPATH 告诉链接器在指定目录搜索 .lib 文件
          # 这不会影响 php8.dll 的链接，因为 php8.dll 不引用我们的库
          $content = $content -replace '(LDFLAGS\s*=\s*)', "`$1/LIBPATH:`"$curlDir\lib`" "

          # -----------------------------------------------------------------
          # 重要：不再修改全局 LIBS！
          #
          # 之前的问题：将 libcurl.lib zlib.lib 等添加到全局 LIBS 后，
          # php8.dll 链接时也会尝试链接这些库，但 vcpkg 目录不在
          # php8.dll 的搜索路径中，导致 LNK1181: cannot open input file 'zlib.lib'
          #
          # 现在的方案：使用 #pragma comment(lib, ...) 在 C 代码中声明依赖
          # #pragma comment(lib,...) 只影响包含该头文件的编译单元
          # 即只有 xhcurl 扩展的 DLL 会链接这些库，php8.dll 不受影响
          # 详见 php_xhcurl.h 中的 Windows 平台链接库声明
          # -----------------------------------------------------------------

          # CRT 冲突处理：
          # 如果使用 x64-windows-static（/MT 静态 CRT），必须加 /NODEFAULTLIB:LIBCMT
          # 避免 vcpkg 静态库的 /MT CRT 与 PHP 的 /MD 动态 CRT 冲突
          # 如果使用 x64-windows-static-md（/MD 动态 CRT），则不需要此选项
          if ($env:VCPKG_TRIPLET -eq "x64-windows-static") {
            $content = $content -replace '(LDFLAGS\s*=\s*)', "`$1/NODEFAULTLIB:LIBCMT "
            Write-Host "检测到 x64-windows-static triplet，添加 /NODEFAULTLIB:LIBCMT"
          } else {
            Write-Host "检测到 $env:VCPKG_TRIPLET triplet，无需 /NODEFAULTLIB:LIBCMT"
          }

          # 写回 Makefile
          Set-Content -Path $makefile -Value $content -NoNewline

          # 显示修改后的相关变量（验证）
          Write-Host "=== 修改后的 Makefile 变量 ==="
          $content -split "`n" | Where-Object { $_ -match "^(LDFLAGS|LIBS|CFLAGS)\s*=" } | ForEach-Object { Write-Host "  $_" }

      # -----------------------------------------------------------------
      # 步骤 8: 编译
      # nmake 使用 MSVC 工具链编译扩展
      # 设置 LIB 环境变量确保 link.exe 能找到 libcurl.lib
      # -----------------------------------------------------------------
      - name: nmake
        shell: cmd
        run: |
          cd php-src
          set LIB=%CURL_DIR%\lib;%LIB%
          nmake /NOLOGO

      # -----------------------------------------------------------------
      # 步骤 8.5: 验证 DLL 依赖（关键！）
      # 使用 dumpbin /dependents 检查编译出的 DLL 是否有外部 DLL 依赖
      #
      # 预期结果（schannel 模式）：
      #   php_xhcurl.dll 应只依赖 Windows 系统 DLL：
      #     - KERNEL32.dll, ntdll.dll    (Windows 基础 API)
      #     - WS2_32.dll                 (Windows Sockets)
      #     - CRYPT32.dll, Secur32.dll   (Windows 证书/安全)
      #     - MSVCR140.dll 等            (Visual C++ 运行时)
      #     - php8.dll 或 php8ts.dll     (PHP 运行时)
      #
      # 如果出现以下 DLL，说明静态链接不完整，用户环境会加载失败：
      #     - libssl-3-x64.dll          (OpenSSL，应使用 schannel 替代)
      #     - libcrypto-3-x64.dll       (OpenSSL，应使用 schannel 替代)
      #     - libcurl.dll               (动态链接 curl，应静态链接)
      #     - zlib.dll / zlib1.dll      (动态链接 zlib，应静态链接)
      # -----------------------------------------------------------------
      - name: Verify DLL dependencies
        shell: pwsh
        run: |
          # 查找编译出的 php_xhcurl.dll
          $dll = Get-ChildItem -Path "php-src" -Recurse -Filter "php_xhcurl.dll" -ErrorAction SilentlyContinue | Select-Object -First 1
          if (-not $dll) {
            Write-Host "::warning::未找到 php_xhcurl.dll，跳过依赖检查"
            return
          }

          Write-Host "=== 检查 DLL 依赖: $($dll.FullName) ==="
          $dependents = & dumpbin /dependents $dll.FullName 2>&1

          # 显示完整依赖列表
          Write-Host $dependents

          # 检查是否有问题的外部 DLL 依赖
          # php8ts.dll 依赖表示 NTS 构建错误地启用了 ZTS
          $problematicDlls = @("libssl", "libcrypto", "libcurl.dll", "zlib.dll", "zlib1.dll")
          $tsMismatch = $false
          $hasProblem = $false

          # 检查 NTS 构建是否错误地依赖了 php8ts.dll（应该是 php8.dll）
          if ("${{ matrix.ts }}" -eq "nts") {
            if ($dependents -match "php8ts\.dll") {
              Write-Host "::error::NTS 构建依赖了 php8ts.dll！--disable-zts 未生效，DLL 无法在 NTS PHP 上加载"
              $tsMismatch = $true
            }
            if ($dependents -match "php8\.dll" -and -not ($dependents -match "php8ts\.dll")) {
              Write-Host "NTS 验证通过：依赖 php8.dll（非 php8ts.dll）"
            }
          }
          foreach ($problematic in $problematicDlls) {
            if ($dependents -match [regex]::Escape($problematic)) {
              Write-Host "::error::检测到外部 DLL 依赖: $problematic"
              Write-Host "::error::此 DLL 在用户环境中可能无法加载（缺少依赖文件）"
              $hasProblem = $true
            }
          }

          if (-not $hasProblem -and -not $tsMismatch) {
            Write-Host "=== 验证通过：DLL 无外部依赖，NTS/ZTS 匹配正确 ==="
          } elseif ($tsMismatch) {
            Write-Host "::error::DLL 的线程安全模式与目标不匹配，需要修复 configure 参数"
          } else {
            Write-Host "::warning::DLL 存在外部依赖，用户环境可能需要额外安装 DLL 文件"
            Write-Host "::warning::建议检查 vcpkg curl[schannel] 是否正确安装"
          }

      # -----------------------------------------------------------------
      # 步骤 9: 收集编译产物（.dll 文件）
      # 重命名为 xhcurl-windows-php{version}-{ts}.dll 格式
      # 完整源码树方式的 DLL 在 php-src/Release*/ 目录下
      # -----------------------------------------------------------------
      - name: Collect build artifacts
        shell: pwsh
        run: |
          $distDir = "dist\windows"
          New-Item -ItemType Directory -Path $distDir -Force | Out-Null

          # 递归搜索 php_xhcurl.dll
          Write-Host "=== 搜索 php_xhcurl.dll ==="
          $allDlls = Get-ChildItem -Path "php-src" -Recurse -Filter "php_xhcurl.dll" -ErrorAction SilentlyContinue
          if ($allDlls) {
            $allDlls | ForEach-Object { Write-Host "  找到: $($_.FullName)" }
          } else {
            Write-Host "  未找到 php_xhcurl.dll"
            # 调试：列出所有 Release 目录内容
            Write-Host "=== Release 目录内容 ==="
            Get-ChildItem -Path "php-src" -Directory -Filter "Release*" -ErrorAction SilentlyContinue | ForEach-Object {
              Write-Host "  目录: $($_.FullName)"
              Get-ChildItem -Path $_.FullName -Filter "*.dll" -ErrorAction SilentlyContinue | ForEach-Object {
                Write-Host "    $($_.Name)"
              }
            }
          }

          # 搜索可能的输出目录
          $searchDirs = @(
            "php-src\Release_TS",
            "php-src\Release",
            "php-src\x64\Release_TS",
            "php-src\x64\Release",
            "php-src\Debug_TS",
            "php-src\Debug",
            "php-src\x64\Debug_TS",
            "php-src\x64\Debug"
          )

          $dllFound = $false
          foreach ($dir in $searchDirs) {
            if (Test-Path $dir) {
              $dll = Get-ChildItem -Path $dir -Filter "php_xhcurl.dll" -ErrorAction SilentlyContinue
              if ($dll) {
                # 重命名为包含平台和版本信息的文件名
                $newName = "xhcurl-windows-php${{ matrix.php-version }}-${{ matrix.ts }}.dll"
                Copy-Item -Path $dll.FullName -Destination (Join-Path $distDir $newName)
                Write-Host "Found: $($dll.FullName) -> $newName"
                $dllFound = $true
                break
              }
            }
          }

          # 如果在常规目录没找到，尝试使用之前全盘搜索的结果
          if (-not $dllFound -and $allDlls) {
            $dll = $allDlls | Select-Object -First 1
            $newName = "xhcurl-windows-php${{ matrix.php-version }}-${{ matrix.ts }}.dll"
            Copy-Item -Path $dll.FullName -Destination (Join-Path $distDir $newName)
            Write-Host "Found (全盘搜索): $($dll.FullName) -> $newName"
            $dllFound = $true
          }

          if (-not $dllFound) {
            echo "::error::未找到编译产物 php_xhcurl.dll"
            exit 1
          }

          Write-Host "=== dist\windows 内容 ==="
          Get-ChildItem -Path $distDir | Format-Table Name, Length

      # -----------------------------------------------------------------
      # 步骤 10: 上传编译产物
      # -----------------------------------------------------------------
      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: xhcurl-windows-php${{ matrix.php-version }}-${{ matrix.ts }}
          path: dist/windows/*
          retention-days: 30

  # =====================================================================
  # Job 4: 发布 Release（仅在 push tag 时触发）
  # 将所有平台的编译产物打包成 GitHub Release 附件
  # =====================================================================
  release:
    name: "Create Release"
    needs: [build-linux, build-macos, build-windows]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      # -----------------------------------------------------------------
      # 步骤 1: 下载所有平台的编译产物
      # -----------------------------------------------------------------
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: all-builds
          merge-multiple: true

      # -----------------------------------------------------------------
      # 步骤 2: 打包所有平台产物并生成校验和
      # 注意：只对二进制文件（.so/.dll）生成校验和，避免递归包含 .txt 文件
      # -----------------------------------------------------------------
      - name: Package releases
        run: |
          mkdir -p release

          echo "=== all-builds 目录结构 ==="
          find all-builds -type f | sort

          # 递归查找所有 .so 和 .dll 文件并移动到 release 目录
          # download-artifact 配置 merge-multiple 后，文件可能分布在子目录中
          find all-builds -type f \( -name "*.so" -o -name "*.dll" \) -exec cp {} release/ \;

          # 显示最终打包内容
          echo "=== Release 内容 ==="
          ls -la release/

          # 统计二进制文件数量
          binary_count=$(find release -type f \( -name "*.so" -o -name "*.dll" \) | wc -l)
          echo "Binary files count: $binary_count"

          if [ "$binary_count" -eq 0 ]; then
            echo "::error::没有找到任何编译产物，无法发布 Release"
            echo "::error::请检查 build-linux 和 build-macos 任务是否成功上传 artifact"
            exit 1
          fi

          # 只对二进制文件生成校验和（避免递归包含 .txt 文件）
          cd release
          # 使用 find 精确匹配二进制文件，排除 .txt 校验和文件
          find . -type f \( -name "*.so" -o -name "*.dll" \) -exec sha256sum {} + > SHA256SUMS.txt
          find . -type f \( -name "*.so" -o -name "*.dll" \) -exec md5sum {} + > MD5SUMS.txt

          # 验证校验和文件非空
          echo "=== SHA256SUMS.txt 内容 ==="
          cat SHA256SUMS.txt
          echo "=== MD5SUMS.txt 内容 ==="
          cat MD5SUMS.txt

          # 确保校验和文件非空（防止 422 上传错误）
          if [ ! -s SHA256SUMS.txt ]; then
            echo "::error::SHA256SUMS.txt 为空"
            exit 1
          fi
          if [ ! -s MD5SUMS.txt ]; then
            echo "::error::MD5SUMS.txt 为空"
            exit 1
          fi

      # -----------------------------------------------------------------
      # 步骤 3: 创建 GitHub Release
      # 使用 @v2 版本（基于 Node 24，避免 Node 20 废弃警告）
      # -----------------------------------------------------------------
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: release/*
          draft: false
          prerelease: false
          generate_release_notes: true
          name: Release ${{ github.ref_name }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # =====================================================================
  # Job 5: 代码质量检查（可选）
  # 使用 cppcheck 进行静态分析
  # =====================================================================
  lint:
    name: "Code Quality Check"
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install cppcheck
        run: sudo apt-get install -y cppcheck

      - name: Run static analysis
        run: |
          echo "=== 运行静态代码分析 ==="
          cppcheck --enable=all --std=c11 \
            --suppress=missingIncludeSystem \
            --error-exitcode=1 \
            *.c 2>&1 || true
          echo "=== 分析完成 ==="
