# +----------------------------------------------------------------------+
# | XHCurl 扩展 - Rust 版本 GitHub Actions CI/CD 流水线                   |
# | 自动化编译：Linux / macOS / Windows 多平台 + 多 PHP 版本              |
# | 使用 cargo 构建 Rust 代码，ext-php-rs 生成 PHP 扩展                  |
# | 编译产物：各平台 .so/.dylib/.dll 扩展文件                             |
# |                                                                      |
# | PHP 版本要求：8.1+                                                   |
# | 原因：XHCurl 协程模式（await/gather）依赖 PHP 8.1 引入的 Fiber 类    |
# +----------------------------------------------------------------------+

name: Build XHCurl Rust Extension

# 触发条件：
#   1. push 到 main 分支
#   2. 创建 v* tag 时触发
#   3. PR 到 main 分支（仅 rust/ 目录变更时）
on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main ]
    paths:
      - 'rust/**'
      - '.github/workflows/build-rust.yml'

# 全局环境变量
env:
  # 扩展名称
  EXTENSION_NAME: xhcurl
  # Rust 工具链版本（Linux / macOS 使用 stable）
  RUST_TOOLCHAIN: stable
  # Windows 专用 Rust 工具链
  # ext-php-rs 在 Windows 上需要 abi_vectorcall 调用约定（nightly-only），
  # 见 rust/src/lib.rs 顶部的 #![cfg_attr(windows, feature(abi_vectorcall))]
  RUST_TOOLCHAIN_WINDOWS: nightly

jobs:
  # =====================================================================
  # Job 1: Linux 平台编译（Ubuntu 24.04）
  # 支持 PHP 8.1 ~ 8.5（Fiber 协程需要 PHP 8.1+）
  # 使用 cargo + ext-php-rs 编译为 .so 扩展
  # =====================================================================
  build-linux:
    name: "Linux Rust (PHP ${{ matrix.php-version }}, Ubuntu ${{ matrix.ubuntu }})"
    runs-on: ubuntu-${{ matrix.ubuntu }}
    strategy:
      fail-fast: false  # 某个版本失败不影响其他版本继续编译
      matrix:
        php-version: ['8.1', '8.2', '8.3', '8.4', '8.5']
        ubuntu: ['24.04']

    steps:
      # -----------------------------------------------------------------
      # 步骤 1: 检出代码仓库
      # -----------------------------------------------------------------
      - name: Checkout repository
        uses: actions/checkout@v4

      # -----------------------------------------------------------------
      # 步骤 2: 安装系统依赖
      # libclang-18-dev: ext-php-rs bindgen 需要 libclang
      # clang-18: cc crate 编译 wrapper.c 使用
      # build-essential: C 编译工具链
      # pkg-config: 库检测工具
      #
      # 重要：Ubuntu 24.04 默认仓库已自带 LLVM 18，无需依赖外部
      # apt.llvm.org 源（该源经常因网络问题连接失败）。
      # ext-php-rs 构建分两阶段，必须使用同一 LLVM 版本：
      #   (1) bindgen 用 LIBCLANG_PATH 的 libclang 生成绑定代码
      #   (2) cc crate 用 CC 编译器编译 wrapper.c
      # 通过显式设置环境变量确保两阶段都用 LLVM 18。
      # -----------------------------------------------------------------
      - name: Install system dependencies
        run: |
          sudo apt-get update -y

          # Ubuntu 24.04 默认仓库已自带 LLVM 18，直接安装
          sudo apt-get install -y \
            libclang-18-dev \
            clang-18 \
            build-essential \
            pkg-config \
            libssl-dev

          # 设置环境变量，让 bindgen 和 cc crate 都使用 LLVM 18
          echo "LIBCLANG_PATH=/usr/lib/llvm-18/lib" >> $GITHUB_ENV
          echo "CLANG_PATH=/usr/lib/llvm-18/bin/clang" >> $GITHUB_ENV
          echo "CC=/usr/lib/llvm-18/bin/clang" >> $GITHUB_ENV
          echo "CXX=/usr/lib/llvm-18/bin/clang++" >> $GITHUB_ENV

          # 将 LLVM 18 的 bin 目录加入 PATH（优先于系统 clang）
          echo "/usr/lib/llvm-18/bin" >> $GITHUB_PATH

          # 确保 libclang.so 符号链接存在（bindgen 需要此文件）
          if [ ! -f "/usr/lib/llvm-18/lib/libclang.so" ]; then
            sudo ln -sf /usr/lib/llvm-18/lib/libclang.so.18 /usr/lib/llvm-18/lib/libclang.so
            echo "已创建 libclang.so 符号链接"
          fi

          # 验证 LLVM 18 安装成功
          echo "=== 验证 LLVM 版本 ==="
          which clang-18 && clang-18 --version
          ls -la /usr/lib/llvm-18/lib/libclang.so || { echo "::error::libclang.so 不存在"; exit 1; }

      # -----------------------------------------------------------------
      # 步骤 2.5: 清除缓存中的旧 bindgen 产物（占位）
      # 实际清理在步骤 5.5 中执行（缓存恢复之后）
      # -----------------------------------------------------------------

      # -----------------------------------------------------------------
      # 步骤 3: 安装指定版本的 PHP 及开发工具
      # ext-php-rs 需要 php-config 获取 PHP 头文件路径
      # -----------------------------------------------------------------
      - name: Setup PHP ${{ matrix.php-version }}
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php-version }}
          tools: php-config
          extensions: curl, json
          coverage: none

      # -----------------------------------------------------------------
      # 步骤 4: 安装 Rust 工具链
      # -----------------------------------------------------------------
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}

      # -----------------------------------------------------------------
      # 步骤 5: 缓存 cargo 编译产物
      # 加速后续构建，避免重复下载和编译依赖
      #
      # 重要：缓存 key 包含 ubuntu 版本标识，确保从 22.04 升级到 24.04 后
      # 旧缓存不会恢复（不同 Ubuntu 版本的 glibc/ABI 可能不兼容）
      # -----------------------------------------------------------------
      - name: Cache cargo artifacts
        uses: actions/cache@v4
        with:
          path: |
            rust/target
            ~/.cargo/registry
            ~/.cargo/git
          # key 中包含 ubuntu 版本标识，OS 版本变更时自动失效旧缓存
          key: linux-rust-ephprs015-ubuntu${{ matrix.ubuntu }}-php${{ matrix.php-version }}-${{ hashFiles('rust/Cargo.lock') }}
          restore-keys: |
            linux-rust-ephprs015-ubuntu${{ matrix.ubuntu }}-php${{ matrix.php-version }}-

      # -----------------------------------------------------------------
      # 步骤 5.5: 清除缓存中可能残留的旧 bindgen 产物
      # 即使缓存 key 包含 llvm18，restore-keys 可能匹配到旧缓存
      # 必须在缓存恢复后清除 ext-php-rs 的 build 输出
      # -----------------------------------------------------------------
      - name: Clean cached bindgen output
        run: |
          # 删除缓存的 ext-php-rs build 输出（可能包含旧版 bindgen 生成的绑定代码）
          rm -rf rust/target/release/build/ext-php-rs-*
          echo "已清除旧的 bindgen 缓存"

      # -----------------------------------------------------------------
      # 步骤 6: 编译 Rust PHP 扩展
      # 使用 --features php 启用 ext-php-rs 绑定
      # --release 优化编译产物
      #
      # 重要：LIBCLANG_PATH 必须在此步骤的 env 中显式设置，
      # 确保 bindgen 使用 LLVM 18 的 libclang（而非系统自带的 LLVM 14）
      # -----------------------------------------------------------------
      - name: Build Rust PHP extension
        working-directory: rust
        env:
          LIBCLANG_PATH: /usr/lib/llvm-18/lib
        run: |
          echo "=== 开始编译 XHCurl Rust 扩展 ==="
          echo "PHP 版本: $(php -v | head -n 1)"
          echo "Rust 版本: $(rustc --version)"
          echo "Cargo 版本: $(cargo --version)"
          echo "LIBCLANG_PATH=$LIBCLANG_PATH"

          # 验证 libclang 可用
          ls -la "$LIBCLANG_PATH/libclang.so" || { echo "::error::libclang.so 未找到"; exit 1; }

          # 编译 Rust PHP 扩展（启用 php feature）
          cargo build --release --features php

          echo "=== 编译成功 ==="

      # -----------------------------------------------------------------
      # 步骤 7: 收集编译产物
      # cargo 编译产物在 target/release/ 下，文件名格式为 libxhcurl.so
      # -----------------------------------------------------------------
      - name: Collect build artifacts
        run: |
          mkdir -p dist/linux
          # 查找编译产物
          if [ -f "rust/target/release/libxhcurl.so" ]; then
            cp "rust/target/release/libxhcurl.so" "dist/linux/xhcurl-rust-linux-php${{ matrix.php-version }}.so"
          else
            echo "::error::未找到编译产物 libxhcurl.so"
            ls -la rust/target/release/*.so 2>/dev/null || true
            exit 1
          fi
          # 显示文件信息
          ls -la dist/linux/
          file dist/linux/*.so

      # -----------------------------------------------------------------
      # 步骤 8: 验证扩展可加载
      # -----------------------------------------------------------------
      - name: Verify extension loads
        run: |
          # 临时复制扩展到 PHP 扩展目录（扩展目录需要 root 权限）
          EXT_DIR=$(php-config --extension-dir)
          sudo cp "dist/linux/xhcurl-rust-linux-php${{ matrix.php-version }}.so" "$EXT_DIR/xhcurl.so"

          # 尝试加载扩展
          php -d extension=xhcurl -r "echo 'XHCurl Rust 扩展加载成功';" || true

      # -----------------------------------------------------------------
      # 步骤 9: 上传编译产物
      # -----------------------------------------------------------------
      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: xhcurl-rust-linux-php${{ matrix.php-version }}
          path: dist/linux/*.so
          retention-days: 30

  # =====================================================================
  # Job 2: macOS 平台编译（macOS 14 / Apple Silicon）
  # 支持 PHP 8.1 ~ 8.3（Fiber 协程需要 PHP 8.1+）
  # ext-php-rs 在 macOS 上编译为 .dylib 扩展
  # =====================================================================
  build-macos:
    name: "macOS Rust (PHP ${{ matrix.php-version }}, macos-14)"
    runs-on: macos-14
    strategy:
      fail-fast: false
      matrix:
        php-version: ['8.1', '8.2', '8.3', '8.4', '8.5']

    steps:
      # -----------------------------------------------------------------
      # 步骤 1: 检出代码
      # -----------------------------------------------------------------
      - name: Checkout repository
        uses: actions/checkout@v4

      # -----------------------------------------------------------------
      # 步骤 2: 安装系统依赖
      # macOS 自带的 Xcode clang 15 在 arm64 上编译 wrapper.c 时会包含
      # arm_neon.h，该版本对 NEON intrinsics 类型转换有 bug：
      #   "invalid conversion between vector type 'float16x8_t' and integer type 'int'"
      # ext-php-rs 的构建分两阶段：
      #   (1) bindgen 用 LIBCLANG_PATH 的 libclang 生成绑定代码
      #   (2) cc crate 用 CC 编译器编译 wrapper.c
      # 必须让两阶段都用 Homebrew 的 LLVM（更新版本，已修复此 bug），
      # 否则 cc crate 会用系统默认 cc（Xcode clang 15）导致 arm_neon.h 报错。
      # -----------------------------------------------------------------
      - name: Install Homebrew dependencies
        run: |
          brew install llvm 2>/dev/null || true
          LLVM_PREFIX=$(brew --prefix llvm)
          echo "LLVM_PATH=$LLVM_PREFIX" >> $GITHUB_ENV
          # 让 cc crate 编译 wrapper.c 时使用 Homebrew 的 clang（而非 Xcode clang 15）
          echo "CC=$LLVM_PREFIX/bin/clang" >> $GITHUB_ENV
          echo "CXX=$LLVM_PREFIX/bin/clang++" >> $GITHUB_ENV
          echo "CLANG_PATH=$LLVM_PREFIX/bin/clang" >> $GITHUB_ENV
          # 将 Homebrew LLVM 加入 PATH（优先于系统 cc）
          echo "$LLVM_PREFIX/bin" >> $GITHUB_PATH

      # -----------------------------------------------------------------
      # 步骤 3: 安装 PHP
      # -----------------------------------------------------------------
      - name: Setup PHP ${{ matrix.php-version }}
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php-version }}
          tools: php-config
          extensions: curl, json
          coverage: none

      # -----------------------------------------------------------------
      # 步骤 4: 安装 Rust 工具链
      # -----------------------------------------------------------------
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}

      # -----------------------------------------------------------------
      # 步骤 5: 缓存 cargo 编译产物
      # -----------------------------------------------------------------
      - name: Cache cargo artifacts
        uses: actions/cache@v4
        with:
          path: |
            rust/target
            ~/.cargo/registry
            ~/.cargo/git
          key: macos-rust-ephprs015-php${{ matrix.php-version }}-${{ hashFiles('rust/Cargo.lock') }}
          restore-keys: |
            macos-rust-ephprs015-php${{ matrix.php-version }}-

      # -----------------------------------------------------------------
      # 步骤 6: 编译 Rust PHP 扩展
      # macOS 需要设置 LIBCLANG_PATH 环境变量
      # -----------------------------------------------------------------
      - name: Build Rust PHP extension
        working-directory: rust
        env:
          # bindgen 需要 libclang 路径
          LIBCLANG_PATH: ${{ env.LLVM_PATH }}/lib
        run: |
          echo "=== 开始编译 XHCurl Rust 扩展 ==="
          echo "PHP 版本: $(php -v | head -n 1)"
          echo "Rust 版本: $(rustc --version)"
          echo "macOS 版本: $(sw_vers -productVersion)"

          # 编译
          cargo build --release --features php

          echo "=== 编译成功 ==="

      # -----------------------------------------------------------------
      # 步骤 7: 收集并上传产物
      # macOS 编译产物为 .dylib 文件
      # -----------------------------------------------------------------
      - name: Collect and upload artifacts
        run: |
          mkdir -p dist/macos

          # 查找编译产物（macOS 可能是 .dylib 或 .so）
          if [ -f "rust/target/release/libxhcurl.dylib" ]; then
            cp "rust/target/release/libxhcurl.dylib" "dist/macos/xhcurl-rust-macos-php${{ matrix.php-version }}.dylib"
          elif [ -f "rust/target/release/libxhcurl.so" ]; then
            cp "rust/target/release/libxhcurl.so" "dist/macos/xhcurl-rust-macos-php${{ matrix.php-version }}.so"
          else
            echo "::error::未找到编译产物"
            ls -la rust/target/release/*.dylib rust/target/release/*.so 2>/dev/null || true
            exit 1
          fi

          ls -la dist/macos/
          file dist/macos/*

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: xhcurl-rust-macos-php${{ matrix.php-version }}
          path: dist/macos/*
          retention-days: 30

  # =====================================================================
  # Job 3: Windows 平台编译
  # 使用 cargo + ext-php-rs 编译为 .dll 扩展
  # 支持 PHP 8.1 ~ 8.5（Fiber 协程需要 PHP 8.1+）
  #
  # Windows 编译注意事项（ext-php-rs 官方要求）：
  #   1. 必须使用 Rust nightly —— abi_vectorcall 调用约定是 nightly-only
  #      （见 rust/src/lib.rs 顶部 #![cfg_attr(windows, feature(abi_vectorcall))]）
  #   2. 必须使用 rust-lld 链接器 —— MSVC link.exe 会导致 build script 崩溃
  #      （STATUS_STACK_BUFFER_OVERRUN, exit code 0xc0000409）
  #      配置在 rust/.cargo/config.toml 中
  #   3. 需要 MSVC cl.exe（cc crate 编译 wrapper.c 需要）—— windows-2022 runner 默认自带
  #   4. 需要 libclang（bindgen 需要）—— 由 KyleMayes/install-llvm-action 提供
  #   5. 需要 PHP 可执行文件（build script 调用 php -i）—— 由 shivammathur/setup-php 提供
  # =====================================================================
  build-windows:
    name: "Windows Rust (PHP ${{ matrix.php-version }}, ${{ matrix.ts }})"
    runs-on: windows-2022
    strategy:
      fail-fast: false
      matrix:
        php-version: ['8.1', '8.2', '8.3', '8.4', '8.5']
        # NTS 和 TS 分别编译（值必须为 setup-php 的 phpts 可识别值：nts / ts）
        ts: ['nts', 'ts']

    steps:
      # -----------------------------------------------------------------
      # 步骤 1: 检出代码
      # -----------------------------------------------------------------
      - name: Checkout repository
        uses: actions/checkout@v4

      # -----------------------------------------------------------------
      # 步骤 2: 安装 Rust nightly 工具链（MSVC 目标）
      # ext-php-rs 在 Windows 上需要 nightly（abi_vectorcall 调用约定是 nightly-only）
      # 参考 ext-php-rs 官方 CI：Windows 矩阵排除 stable，仅用 nightly
      # -----------------------------------------------------------------
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN_WINDOWS }}
          targets: x86_64-pc-windows-msvc
          components: rustfmt, clippy

      # -----------------------------------------------------------------
      # 步骤 3: 安装 LLVM 17（bindgen 依赖 libclang）
      #
      # 固定到 LLVM 17（而非 choco install llvm 装的最新版），原因：
      # ext-php-rs 0.15 依赖 bindgen 0.72.1（fork 版），虽已修复
      #   `_Complex _Float16` panic，但为保持与历史验证一致仍用 LLVM 17。
      # 使用 KyleMayes/install-llvm-action 与 ext-php-rs 官方 CI 一致。
      # -----------------------------------------------------------------
      - name: Cache LLVM 17
        id: cache-llvm
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/llvm-17
          key: windows-llvm-17

      - name: Setup LLVM 17
        id: clang
        uses: KyleMayes/install-llvm-action@v2
        with:
          version: "17"
          directory: ${{ runner.temp }}/llvm-17
          cached: ${{ steps.cache-llvm.outputs.cache-hit }}

      - name: Configure LIBCLANG_PATH
        shell: pwsh
        run: |
          # Windows 上 libclang.dll 位于 LLVM 安装目录的 bin 下
          echo "LIBCLANG_PATH=$env:LLVM_PATH\bin" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          Write-Host "LLVM 版本: $(${{ steps.clang.outputs.version }})"
          Write-Host "LIBCLANG_PATH: $env:LLVM_PATH\bin"
          # 验证 libclang.dll 存在
          if (Test-Path "$env:LLVM_PATH\bin\libclang.dll") {
            Write-Host "libclang.dll 已就绪"
          } else {
            Write-Host "::error::libclang.dll 未找到于 $env:LLVM_PATH\bin"
            exit 1
          }

      # -----------------------------------------------------------------
      # 步骤 4: 安装 PHP
      # 参考 ext-php-rs 官方 CI：用 shivammathur/setup-php，
      # 线程安全通过 env: phpts 传入（ts/nts），并开启 debug 构建
      # ext-php-rs build script 通过 `php -i` 自动定位 PHP 头文件，
      # 无需手动设置 PHP_INCLUDE_PATH
      # -----------------------------------------------------------------
      - name: Setup PHP ${{ matrix.php-version }}
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php-version }}
          extensions: curl, json
          coverage: none
          ini-values: memory_limit=512M
        env:
          phpts: ${{ matrix.ts }}
          debug: true

      # -----------------------------------------------------------------
      # 步骤 5: 缓存 cargo 编译产物
      # key 包含 nightly 标识，从 stable 切换到 nightly 时自动失效旧缓存
      # -----------------------------------------------------------------
      - name: Cache cargo artifacts
        uses: actions/cache@v4
        with:
          path: |
            rust/target
            ~/.cargo/registry
            ~/.cargo/git
          key: windows-rust-ephprs015-php${{ matrix.php-version }}-${{ matrix.ts }}-${{ hashFiles('rust/Cargo.lock') }}
          restore-keys: |
            windows-rust-ephprs015-php${{ matrix.php-version }}-${{ matrix.ts }}-

      # -----------------------------------------------------------------
      # 步骤 6: 编译 Rust PHP 扩展
      # Windows 上 ext-php-rs 需要：
      #   - nightly Rust（abi_vectorcall 调用约定，见 lib.rs 顶部）
      #   - rust-lld 链接器（配置在 .cargo/config.toml，避免 MSVC link.exe 崩溃：
      #     STATUS_STACK_BUFFER_OVERRUN, exit code 0xc0000409）
      #   - php.exe 在 PATH 中（build script 调用 php -i 定位头文件）
      #   - libclang（bindgen 需要，由步骤 3 LLVM 提供）
      #   - cl.exe（cc crate 编译 wrapper.c；windows-latest runner 默认自带）
      # 参考 ext-php-rs 官方 CI：不使用 msvc-dev-cmd，不设置 PHP_INCLUDE_PATH
      # -----------------------------------------------------------------
      - name: Build Rust PHP extension
        working-directory: rust
        shell: pwsh
        run: |
          Write-Host "=== 开始编译 XHCurl Rust 扩展 ==="
          Write-Host "PHP 版本: $(php -v 2>&1 | Select-Object -First 1)"
          Write-Host "Rust 版本: $(rustc --version)"
          Write-Host "LIBCLANG_PATH: $env:LIBCLANG_PATH"

          # 验证 libclang 可用（LLVM 17）
          if (-not (Test-Path "$env:LIBCLANG_PATH\libclang.dll")) {
            Write-Host "::error::libclang.dll 未找到于 $env:LIBCLANG_PATH"
            Get-ChildItem $env:LIBCLANG_PATH -Filter "libclang*" -ErrorAction SilentlyContinue
            exit 1
          }
          Write-Host "libclang: $(Get-ChildItem "$env:LIBCLANG_PATH\libclang*")"

          # 清除缓存的 ext-php-rs build 输出（避免旧 LLVM 19 缓存残留触发 _Complex _Float16 panic）
          if (Test-Path "target\release\build\ext-php-rs-*") {
            Remove-Item -Recurse -Force "target\release\build\ext-php-rs-*" -ErrorAction SilentlyContinue
            Write-Host "已清除旧的 ext-php-rs build 缓存"
          }

          cargo build --release --features php

          if ($LASTEXITCODE -eq 0) {
            Write-Host "=== 编译成功 ==="
          } else {
            Write-Host "::error::编译失败"
            exit 1
          }

      # -----------------------------------------------------------------
      # 步骤 7: 收集并上传产物
      # Windows 编译产物为 .dll 文件
      # -----------------------------------------------------------------
      - name: Collect and upload artifacts
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path "dist/windows" -Force | Out-Null

          # 查找编译产物
          $dllPath = "rust/target/release/xhcurl.dll"
          if (-not (Test-Path $dllPath)) {
            # 尝试带 lib 前缀
            $dllPath = "rust/target/release/xhcurl.dll"
          }

          if (Test-Path $dllPath) {
            Copy-Item -Path $dllPath -Destination "dist/windows/xhcurl-rust-windows-php${{ matrix.php-version }}-${{ matrix.ts }}.dll"
          } else {
            Write-Host "::error::未找到编译产物 xhcurl.dll"
            Get-ChildItem -Path "rust/target/release/*.dll" -ErrorAction SilentlyContinue | ForEach-Object { Write-Host "  $($_.Name)" }
            exit 1
          }

          Get-ChildItem -Path "dist/windows" | ForEach-Object { Write-Host "  $($_.Name)" }

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: xhcurl-rust-windows-php${{ matrix.php-version }}-${{ matrix.ts }}
          path: dist/windows/*.dll
          retention-days: 30

  # =====================================================================
  # Job 4: Rust 代码质量检查
  # 运行 cargo clippy 和 cargo test
  # =====================================================================
  lint-and-test:
    name: "Rust Lint & Test"
    runs-on: ubuntu-24.04

    steps:
      # -----------------------------------------------------------------
      # 步骤 1: 检出代码
      # -----------------------------------------------------------------
      - name: Checkout repository
        uses: actions/checkout@v4

      # -----------------------------------------------------------------
      # 步骤 2: 安装系统依赖（Ubuntu 24.04 自带 LLVM 18）
      # -----------------------------------------------------------------
      - name: Install system dependencies
        run: |
          sudo apt-get update -y

          sudo apt-get install -y \
            libclang-18-dev \
            clang-18 \
            build-essential \
            pkg-config \
            libssl-dev

          echo "LIBCLANG_PATH=/usr/lib/llvm-18/lib" >> $GITHUB_ENV

      # -----------------------------------------------------------------
      # 步骤 3: 安装 Rust 工具链（含 clippy 组件）
      # -----------------------------------------------------------------
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
          components: clippy, rustfmt

      # -----------------------------------------------------------------
      # 步骤 4: 缓存（key 包含 llvm18 标识，避免恢复旧 LLVM 14 缓存）
      # -----------------------------------------------------------------
      - name: Cache cargo artifacts
        uses: actions/cache@v4
        with:
          path: |
            rust/target
            ~/.cargo/registry
            ~/.cargo/git
          key: linux-rust-llvm18v2-lint-${{ hashFiles('rust/Cargo.lock') }}
          restore-keys: |
            linux-rust-llvm18v2-lint-

      # -----------------------------------------------------------------
      # 步骤 4.5: 清除缓存中可能残留的旧 bindgen 产物
      # -----------------------------------------------------------------
      - name: Clean cached bindgen output
        run: |
          rm -rf rust/target/release/build/ext-php-rs-*
          echo "已清除旧的 bindgen 缓存"

      # -----------------------------------------------------------------
      # 步骤 5: 代码格式检查
      # -----------------------------------------------------------------
      - name: Check formatting
        working-directory: rust
        run: |
          echo "=== 检查代码格式 ==="
          cargo fmt -- --check

      # -----------------------------------------------------------------
      # 步骤 6: Clippy 静态分析
      # 不启用 php feature（避免依赖 PHP 开发头文件）
      # -----------------------------------------------------------------
      - name: Run Clippy
        working-directory: rust
        run: |
          echo "=== 运行 Clippy 静态分析 ==="
          cargo clippy -- -D warnings

      # -----------------------------------------------------------------
      # 步骤 7: 运行测试
      # 不启用 php feature，仅测试核心逻辑
      # -----------------------------------------------------------------
      - name: Run tests
        working-directory: rust
        run: |
          echo "=== 运行测试 ==="
          cargo test

  # =====================================================================
  # Job 5: 发布 GitHub Release
  # 仅在推送 v* tag 时触发，收集所有平台的编译产物发布到 GitHub Releases
  # 依赖所有 build job 和 lint job 全部通过
  # =====================================================================
  release:
    name: "Publish GitHub Release"
    runs-on: ubuntu-24.04
    # 仅 tag 触发，且需要所有构建和检查 job 通过
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [build-linux, build-macos, build-windows, lint-and-test]

    permissions:
      # 创建 Release 需要 write 权限
      contents: write

    steps:
      # -----------------------------------------------------------------
      # 步骤 1: 检出代码
      # -----------------------------------------------------------------
      - name: Checkout repository
        uses: actions/checkout@v4

      # -----------------------------------------------------------------
      # 步骤 2: 下载所有平台的编译产物
      # actions/download-artifact 会将每个 artifact 下载到以 artifact 名命名的子目录
      # -----------------------------------------------------------------
      - name: Download all build artifacts
        uses: actions/download-artifact@v4
        with:
          # 合并所有 artifact 到同一目录（使用 pattern 匹配所有 xhcurl-rust-* artifact）
          pattern: xhcurl-rust-*
          path: artifacts
          merge-multiple: false

      # -----------------------------------------------------------------
      # 步骤 3: 整理产物目录结构
      # 将分散在各子目录的 .so/.dylib/.dll 文件统一收集到 release/ 目录
      # -----------------------------------------------------------------
      - name: Organize release files
        run: |
          mkdir -p release
          echo "=== 下载的 artifacts 目录结构 ==="
          find artifacts -type f | sort

          echo ""
          echo "=== 整理产物到 release/ 目录 ==="
          # 递归查找所有扩展文件并复制到 release/
          find artifacts -type f \( -name "*.so" -o -name "*.dylib" -o -name "*.dll" \) -exec cp {} release/ \;

          echo ""
          echo "=== 最终 release/ 目录内容 ==="
          ls -la release/
          echo ""
          echo "=== 文件数量: $(ls release/ | wc -l) 个 ==="

      # -----------------------------------------------------------------
      # 步骤 4: 创建 GitHub Release 并上传所有产物
      # -----------------------------------------------------------------
      - name: Create GitHub Release and Upload Assets
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: XHCurl ${{ github.ref_name }}
          body: |
            ## XHCurl Rust 扩展 - 自动编译发布

            ### 产物清单

            以下是所有平台 + PHP 版本的预编译扩展文件，请根据你的平台和 PHP 版本选择对应文件：

            | 平台 | 文件格式 | PHP 版本 |
            |------|----------|----------|
            | Linux (Ubuntu 24.04, x64) | `.so` | 8.1, 8.2, 8.3, 8.4, 8.5 |
            | macOS 14 (Apple Silicon) | `.dylib` | 8.1, 8.2, 8.3, 8.4, 8.5 |
            | Windows (x64) | `.dll` | 8.1, 8.2, 8.3, 8.4, 8.5 (NTS/ZTS) |

            ### 文件命名规则

            - `xhcurl-rust-linux-php{版本}.so` - Linux
            - `xhcurl-rust-macos-php{版本}.dylib` - macOS
            - `xhcurl-rust-windows-php{版本}-{nts|ts}.dll` - Windows（NTS=非线程安全, TS=线程安全）

            ### 安装方法

            1. 根据你的平台和 PHP 版本下载对应的文件
            2. 重命名为 `xhcurl.so`（Linux/macOS）或 `xhcurl.dll`（Windows）
            3. 放到 PHP 扩展目录（`php-config --extension-dir` 或 Windows 的 `ext/`）
            4. 在 `php.ini` 中添加 `extension=xhcurl`（Linux/macOS）或 `extension=xhcurl.dll`（Windows）

            ### 验证安装

            ```bash
            php -m | grep xhcurl
            php -r "echo XHCurl::version();"
            ```

            > **注意**：需要 PHP 8.1+（协程模式依赖 PHP Fiber）
          # release/ 目录下所有文件都作为附件上传
          files: release/*
          # 标记为正式发布（非 prerelease）
          prerelease: false
          draft: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
