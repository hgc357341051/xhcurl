# +----------------------------------------------------------------------+
# | XHCurl 扩展 - Rust 版本 GitHub Actions CI/CD 流水线                   |
# | 自动化编译：Linux / macOS / Windows 多平台 + 多 PHP 版本              |
# | 使用 cargo 构建 Rust 代码，ext-php-rs 生成 PHP 扩展                  |
# | 编译产物：各平台 .so/.dylib/.dll 扩展文件                             |
# +----------------------------------------------------------------------+

name: Build XHCurl Rust Extension

# 触发条件：
#   1. push 到 main 分支
#   2. 创建 v* 或 rust-v* tag 时触发（支持 v1.0.0 和 rust-v1.0.0 两种格式）
#   3. PR 到 main 分支（仅 rust/ 目录变更时）
on:
  push:
    branches: [ main ]
    # 支持 v* 和 rust-v* 两种 tag 格式
    # v1.0.0 - 同时触发 C 和 Rust 版本编译
    # rust-v1.0.0 - 仅触发 Rust 版本编译
    tags: [ 'v*', 'rust-v*' ]
  pull_request:
    branches: [ main ]
    # 仅在 rust/ 目录变更时触发
    paths:
      - 'rust/**'
      - '.github/workflows/build-rust.yml'

# 全局环境变量
env:
  # 扩展名称
  EXTENSION_NAME: xhcurl
  # Rust 工具链版本
  RUST_TOOLCHAIN: stable

jobs:
  # =====================================================================
  # Job 1: Linux 平台编译（Ubuntu 22.04）
  # 支持 PHP 8.0 ~ 8.4
  # 使用 cargo + ext-php-rs 编译为 .so 扩展
  # =====================================================================
  build-linux:
    name: "Linux Rust (PHP ${{ matrix.php-version }}, Ubuntu ${{ matrix.ubuntu }})"
    runs-on: ubuntu-${{ matrix.ubuntu }}
    strategy:
      fail-fast: false  # 某个版本失败不影响其他版本继续编译
      matrix:
        php-version: ['8.0', '8.1', '8.2', '8.3', '8.4']
        ubuntu: ['22.04']

    steps:
      # -----------------------------------------------------------------
      # 步骤 1: 检出代码仓库
      # -----------------------------------------------------------------
      - name: Checkout repository
        uses: actions/checkout@v4

      # -----------------------------------------------------------------
      # 步骤 2: 安装系统依赖
      # libclang-dev: ext-php-rs bindgen 需要
      # build-essential: C 编译工具链
      # pkg-config: 库检测工具
      #
      # 重要：Ubuntu 22.04 自带的 LLVM 14 存在 bindgen 兼容性问题
      # （emmintrin.h SSE2 intrinsics 类型转换错误），
      # 必须安装 LLVM 18 才能正常生成 PHP 绑定代码
      #
      # 安装方式：通过 LLVM 官方 APT 源安装 LLVM 18
      # -----------------------------------------------------------------
      - name: Install system dependencies
        run: |
          sudo apt-get update -y
          # 安装 add-apt-repository 所需的依赖
          sudo apt-get install -y software-properties-common wget gnupg2

          # 添加 LLVM 18 官方 APT 源
          wget -qO- https://apt.llvm.org/llvm-snapshot.gpg.key | sudo tee /etc/apt/trusted.gpg.d/llvm.asc > /dev/null
          sudo add-apt-repository -y "deb http://apt.llvm.org/jammy/ llvm-toolchain-jammy-18 main"
          sudo apt-get update -y

          # 安装 LLVM 18 的 libclang（bindgen 使用）
          # 不安装默认的 libclang-dev（会拉取 LLVM 14）
          sudo apt-get install -y \
            libclang-18-dev \
            clang-18 \
            build-essential \
            pkg-config \
            libssl-dev

          # 设置 LIBCLANG_PATH 环境变量，让 bindgen 使用 LLVM 18 的 libclang
          echo "LIBCLANG_PATH=/usr/lib/llvm-18/lib" >> $GITHUB_ENV

          # 验证 LLVM 18 安装成功
          echo "=== 验证 LLVM 版本 ==="
          clang-18 --version
          ls -la /usr/lib/llvm-18/lib/libclang.so 2>/dev/null || echo "libclang-18.so not found"
          ls -la /usr/lib/llvm-18/lib/libclang-18.so 2>/dev/null || echo "libclang-18.so.18 not found"

      # -----------------------------------------------------------------
      # 步骤 2.5: 清除缓存中的旧 bindgen 产物
      # 如果缓存了 LLVM 14 生成的绑定代码，切换到 LLVM 18 后
      # 必须清除旧的 build 输出，否则会继续使用旧的（有错误的）绑定
      # -----------------------------------------------------------------
      - name: Clean cached bindgen output
        run: |
          # 删除缓存的 ext-php-rs build 输出（包含旧版 bindgen 生成的绑定代码）
          rm -rf rust/target/release/build/ext-php-rs-*
          echo "已清除旧的 bindgen 缓存"

      # -----------------------------------------------------------------
      # 步骤 3: 安装指定版本的 PHP 及开发工具
      # ext-php-rs 需要 php-config 获取 PHP 头文件路径
      # -----------------------------------------------------------------
      - name: Setup PHP ${{ matrix.php-version }}
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php-version }}
          tools: php-config
          extensions: curl, json
          coverage: none

      # -----------------------------------------------------------------
      # 步骤 4: 安装 Rust 工具链
      # -----------------------------------------------------------------
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}

      # -----------------------------------------------------------------
      # 步骤 5: 缓存 cargo 编译产物
      # 加速后续构建，避免重复下载和编译依赖
      # -----------------------------------------------------------------
      - name: Cache cargo artifacts
        uses: actions/cache@v4
        with:
          path: |
            rust/target
            ~/.cargo/registry
            ~/.cargo/git
          key: linux-rust-php${{ matrix.php-version }}-${{ hashFiles('rust/Cargo.lock') }}
          restore-keys: |
            linux-rust-php${{ matrix.php-version }}-

      # -----------------------------------------------------------------
      # 步骤 6: 编译 Rust PHP 扩展
      # 使用 --features php 启用 ext-php-rs 绑定
      # --release 优化编译产物
      # -----------------------------------------------------------------
      - name: Build Rust PHP extension
        working-directory: rust
        run: |
          echo "=== 开始编译 XHCurl Rust 扩展 ==="
          echo "PHP 版本: $(php -v | head -n 1)"
          echo "Rust 版本: $(rustc --version)"
          echo "Cargo 版本: $(cargo --version)"

          # 编译 Rust PHP 扩展（启用 php feature）
          cargo build --release --features php

          echo "=== 编译成功 ==="

      # -----------------------------------------------------------------
      # 步骤 7: 收集编译产物
      # cargo 编译产物在 target/release/ 下，文件名格式为 libxhcurl.so
      # -----------------------------------------------------------------
      - name: Collect build artifacts
        run: |
          mkdir -p dist/linux
          # 查找编译产物
          if [ -f "rust/target/release/libxhcurl.so" ]; then
            cp "rust/target/release/libxhcurl.so" "dist/linux/xhcurl-rust-linux-php${{ matrix.php-version }}.so"
          else
            echo "::error::未找到编译产物 libxhcurl.so"
            ls -la rust/target/release/*.so 2>/dev/null || true
            exit 1
          fi
          # 显示文件信息
          ls -la dist/linux/
          file dist/linux/*.so

      # -----------------------------------------------------------------
      # 步骤 8: 验证扩展可加载
      # -----------------------------------------------------------------
      - name: Verify extension loads
        run: |
          # 临时复制扩展到 PHP 扩展目录
          EXT_DIR=$(php-config --extension-dir)
          cp "dist/linux/xhcurl-rust-linux-php${{ matrix.php-version }}.so" "$EXT_DIR/xhcurl.so"

          # 尝试加载扩展
          php -d extension=xhcurl -r "echo 'XHCurl Rust 扩展加载成功';" || true

      # -----------------------------------------------------------------
      # 步骤 9: 上传编译产物
      # -----------------------------------------------------------------
      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: xhcurl-rust-linux-php${{ matrix.php-version }}
          path: dist/linux/*.so
          retention-days: 30

  # =====================================================================
  # Job 2: macOS 平台编译（macOS 14 / Apple Silicon）
  # 支持 PHP 8.0 ~ 8.3
  # ext-php-rs 在 macOS 上编译为 .dylib 扩展
  # =====================================================================
  build-macos:
    name: "macOS Rust (PHP ${{ matrix.php-version }}, macos-14)"
    runs-on: macos-14
    strategy:
      fail-fast: false
      matrix:
        php-version: ['8.0', '8.1', '8.2', '8.3']

    steps:
      # -----------------------------------------------------------------
      # 步骤 1: 检出代码
      # -----------------------------------------------------------------
      - name: Checkout repository
        uses: actions/checkout@v4

      # -----------------------------------------------------------------
      # 步骤 2: 安装系统依赖
      # macOS 自带 clang，但需要安装 libclang 的 bindgen 依赖
      # -----------------------------------------------------------------
      - name: Install Homebrew dependencies
        run: |
          brew install llvm 2>/dev/null || true
          echo "LLVM_PATH=$(brew --prefix llvm)" >> $GITHUB_ENV

      # -----------------------------------------------------------------
      # 步骤 3: 安装 PHP
      # -----------------------------------------------------------------
      - name: Setup PHP ${{ matrix.php-version }}
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php-version }}
          tools: php-config
          extensions: curl, json
          coverage: none

      # -----------------------------------------------------------------
      # 步骤 4: 安装 Rust 工具链
      # -----------------------------------------------------------------
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}

      # -----------------------------------------------------------------
      # 步骤 5: 缓存 cargo 编译产物
      # -----------------------------------------------------------------
      - name: Cache cargo artifacts
        uses: actions/cache@v4
        with:
          path: |
            rust/target
            ~/.cargo/registry
            ~/.cargo/git
          key: macos-rust-php${{ matrix.php-version }}-${{ hashFiles('rust/Cargo.lock') }}
          restore-keys: |
            macos-rust-php${{ matrix.php-version }}-

      # -----------------------------------------------------------------
      # 步骤 6: 编译 Rust PHP 扩展
      # macOS 需要设置 LIBCLANG_PATH 环境变量
      # -----------------------------------------------------------------
      - name: Build Rust PHP extension
        working-directory: rust
        env:
          # bindgen 需要 libclang 路径
          LIBCLANG_PATH: ${{ env.LLVM_PATH }}/lib
        run: |
          echo "=== 开始编译 XHCurl Rust 扩展 ==="
          echo "PHP 版本: $(php -v | head -n 1)"
          echo "Rust 版本: $(rustc --version)"
          echo "macOS 版本: $(sw_vers -productVersion)"

          # 编译
          cargo build --release --features php

          echo "=== 编译成功 ==="

      # -----------------------------------------------------------------
      # 步骤 7: 收集并上传产物
      # macOS 编译产物为 .dylib 文件
      # -----------------------------------------------------------------
      - name: Collect and upload artifacts
        run: |
          mkdir -p dist/macos

          # 查找编译产物（macOS 可能是 .dylib 或 .so）
          if [ -f "rust/target/release/libxhcurl.dylib" ]; then
            cp "rust/target/release/libxhcurl.dylib" "dist/macos/xhcurl-rust-macos-php${{ matrix.php-version }}.dylib"
          elif [ -f "rust/target/release/libxhcurl.so" ]; then
            cp "rust/target/release/libxhcurl.so" "dist/macos/xhcurl-rust-macos-php${{ matrix.php-version }}.so"
          else
            echo "::error::未找到编译产物"
            ls -la rust/target/release/*.dylib rust/target/release/*.so 2>/dev/null || true
            exit 1
          fi

          ls -la dist/macos/
          file dist/macos/*

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: xhcurl-rust-macos-php${{ matrix.php-version }}
          path: dist/macos/*
          retention-days: 30

  # =====================================================================
  # Job 3: Windows 平台编译
  # 使用 cargo + ext-php-rs 编译为 .dll 扩展
  #
  # Windows 编译注意事项：
  #   1. 需要安装 Rust MSVC 工具链
  #   2. 需要安装 PHP 开发头文件（php-devel）
  #   3. libclang 需要 LLVM 安装
  #   4. ext-php-rs 的 bindgen 在 Windows 上需要特殊配置
  # =====================================================================
  build-windows:
    name: "Windows Rust (PHP ${{ matrix.php-version }}, ${{ matrix.ts }})"
    runs-on: windows-2022
    strategy:
      fail-fast: false
      matrix:
        php-version: ['8.0', '8.1', '8.2', '8.3', '8.4']
        # NTS 和 ZTS 分别编译
        ts: ['nts', 'zts']

    steps:
      # -----------------------------------------------------------------
      # 步骤 1: 检出代码
      # -----------------------------------------------------------------
      - name: Checkout repository
        uses: actions/checkout@v4

      # -----------------------------------------------------------------
      # 步骤 2: 安装 Rust 工具链（MSVC 目标）
      # -----------------------------------------------------------------
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
          targets: x86_64-pc-windows-msvc

      # -----------------------------------------------------------------
      # 步骤 3: 安装 LLVM（bindgen 依赖）
      # -----------------------------------------------------------------
      - name: Install LLVM
        run: |
          choco install llvm -y
          echo "C:\Program Files\LLVM\bin" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
          echo "LIBCLANG_PATH=C:\Program Files\LLVM\bin" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      # -----------------------------------------------------------------
      # 步骤 4: 设置 PHP SDK
      # ext-php-rs 需要 php-config 和 php 可执行文件
      # setup-php-sdk 会将 PHP 添加到 PATH
      # -----------------------------------------------------------------
      - name: Setup PHP SDK
        id: setup-php-sdk
        uses: php/setup-php-sdk@v0.12
        with:
          version: ${{ matrix.php-version }}
          arch: x64
          ts: ${{ matrix.ts }}
          cache: true

      # -----------------------------------------------------------------
      # 步骤 4.5: 确保 PHP 在 PATH 中
      # ext-php-rs build script 调用 `php -i` 获取 PHP 配置信息
      # 如果 php 不在 PATH 中，bindgen 会失败
      #
      # 注意：Windows 上不存在 php-config 命令，不能调用它
      # -----------------------------------------------------------------
      - name: Verify PHP in PATH
        shell: pwsh
        run: |
          # 输出 setup-php-sdk 的 prefix 路径
          $prefix = "${{ steps.setup-php-sdk.outputs.prefix }}"
          Write-Host "PHP SDK prefix: $prefix"

          # 检查 php 是否在 PATH 中
          $phpPath = Get-Command php -ErrorAction SilentlyContinue
          if ($phpPath) {
            Write-Host "PHP found in PATH: $($phpPath.Source)"
            php -v 2>&1 | Select-Object -First 1
          } else {
            Write-Host "::warning::PHP not in PATH, attempting to add it"

            # 尝试从 prefix 路径添加 PHP 到 PATH
            if ($prefix -and (Test-Path $prefix)) {
              $phpExe = Join-Path $prefix "php.exe"
              if (Test-Path $phpExe) {
                $phpDir = Split-Path $phpExe
                Write-Host "Adding PHP directory to PATH: $phpDir"
                echo $phpDir | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
                # 同时设置当前会话的 PATH
                $env:PATH = "$phpDir;$env:PATH"
                php -v 2>&1 | Select-Object -First 1
              } else {
                Write-Host "::error::php.exe not found at $phpExe"
                # 搜索 php.exe
                Get-ChildItem -Path $prefix -Filter "php.exe" -Recurse -ErrorAction SilentlyContinue |
                  ForEach-Object { Write-Host "  Found: $($_.FullName)" }
                exit 1
              }
            } else {
              Write-Host "::error::PHP SDK prefix is empty or does not exist"
              exit 1
            }
          }

          # Windows 上不存在 php-config，跳过
          # ext-php-rs 在 Windows 上通过 php -i 获取配置，不需要 php-config
          Write-Host "PHP 验证完成"

      # -----------------------------------------------------------------
      # 步骤 5: 设置 MSVC 编译环境
      # -----------------------------------------------------------------
      - name: Setup MSVC developer command prompt
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64
          toolset: ${{ steps.setup-php-sdk.outputs.toolset }}

      # -----------------------------------------------------------------
      # 步骤 6: 缓存 cargo 编译产物
      # -----------------------------------------------------------------
      - name: Cache cargo artifacts
        uses: actions/cache@v4
        with:
          path: |
            rust/target
            ~/.cargo/registry
            ~/.cargo/git
          key: windows-rust-php${{ matrix.php-version }}-${{ matrix.ts }}-${{ hashFiles('rust/Cargo.lock') }}
          restore-keys: |
            windows-rust-php${{ matrix.php-version }}-${{ matrix.ts }}-

      # -----------------------------------------------------------------
      # 步骤 7: 编译 Rust PHP 扩展
      # Windows 上 ext-php-rs 需要 PHP_INCLUDE_PATH 环境变量
      # 同时需要确保 php.exe 在 PATH 中（build script 调用 php -i）
      # -----------------------------------------------------------------
      - name: Build Rust PHP extension
        working-directory: rust
        env:
          # ext-php-rs 需要 PHP 的 include 路径
          PHP_INCLUDE_PATH: ${{ steps.setup-php-sdk.outputs.prefix }}/include
          # 确保 bindgen 找到 libclang
          LIBCLANG_PATH: C:\Program Files\LLVM\bin
        shell: pwsh
        run: |
          Write-Host "=== 开始编译 XHCurl Rust 扩展 ==="

          # 验证 PHP 可用
          try {
            $phpVer = php -v 2>&1 | Select-Object -First 1
            Write-Host "PHP 版本: $phpVer"
          } catch {
            Write-Host "::error::PHP 不可用，请检查 PATH 设置"
            exit 1
          }

          Write-Host "Rust 版本: $(rustc --version)"
          Write-Host "PHP Include: $env:PHP_INCLUDE_PATH"
          Write-Host "LIBCLANG_PATH: $env:LIBCLANG_PATH"

          # 验证 include 路径是否存在
          if (-not (Test-Path $env:PHP_INCLUDE_PATH)) {
            Write-Host "::warning::PHP_INCLUDE_PATH 不存在: $env:PHP_INCLUDE_PATH"
            # 尝试查找正确的 include 路径
            $prefix = "${{ steps.setup-php-sdk.outputs.prefix }}"
            Write-Host "Searching for include path in: $prefix"
            Get-ChildItem -Path $prefix -Filter "php.h" -Recurse -ErrorAction SilentlyContinue |
              ForEach-Object { Write-Host "  Found: $($_.FullName)" }
          }

          # 编译
          cargo build --release --features php

          if ($LASTEXITCODE -eq 0) {
            Write-Host "=== 编译成功 ==="
          } else {
            Write-Host "::error::编译失败"
            exit 1
          }

      # -----------------------------------------------------------------
      # 步骤 8: 收集并上传产物
      # Windows 编译产物为 .dll 文件
      # -----------------------------------------------------------------
      - name: Collect and upload artifacts
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path "dist/windows" -Force | Out-Null

          # 查找编译产物
          $dllPath = "rust/target/release/xhcurl.dll"
          if (-not (Test-Path $dllPath)) {
            # 尝试带 lib 前缀
            $dllPath = "rust/target/release/xhcurl.dll"
          }

          if (Test-Path $dllPath) {
            Copy-Item -Path $dllPath -Destination "dist/windows/xhcurl-rust-windows-php${{ matrix.php-version }}-${{ matrix.ts }}.dll"
          } else {
            Write-Host "::error::未找到编译产物 xhcurl.dll"
            Get-ChildItem -Path "rust/target/release/*.dll" -ErrorAction SilentlyContinue | ForEach-Object { Write-Host "  $($_.Name)" }
            exit 1
          }

          Get-ChildItem -Path "dist/windows" | ForEach-Object { Write-Host "  $($_.Name)" }

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: xhcurl-rust-windows-php${{ matrix.php-version }}-${{ matrix.ts }}
          path: dist/windows/*.dll
          retention-days: 30

  # =====================================================================
  # Job 4: Rust 代码质量检查
  # 运行 cargo clippy 和 cargo test
  # =====================================================================
  lint-and-test:
    name: "Rust Lint & Test"
    runs-on: ubuntu-22.04

    steps:
      # -----------------------------------------------------------------
      # 步骤 1: 检出代码
      # -----------------------------------------------------------------
      - name: Checkout repository
        uses: actions/checkout@v4

      # -----------------------------------------------------------------
      # 步骤 2: 安装系统依赖（LLVM 18 替代系统自带 LLVM 14）
      # -----------------------------------------------------------------
      - name: Install system dependencies
        run: |
          sudo apt-get update -y
          sudo apt-get install -y software-properties-common wget gnupg2

          # 添加 LLVM 18 源
          wget -qO- https://apt.llvm.org/llvm-snapshot.gpg.key | sudo tee /etc/apt/trusted.gpg.d/llvm.asc > /dev/null
          sudo add-apt-repository -y "deb http://apt.llvm.org/jammy/ llvm-toolchain-jammy-18 main"
          sudo apt-get update -y

          sudo apt-get install -y \
            libclang-18-dev \
            clang-18 \
            build-essential \
            pkg-config \
            libssl-dev

          echo "LIBCLANG_PATH=/usr/lib/llvm-18/lib" >> $GITHUB_ENV

      # -----------------------------------------------------------------
      # 步骤 2.5: 清除缓存中的旧 bindgen 产物
      # -----------------------------------------------------------------
      - name: Clean cached bindgen output
        run: |
          rm -rf rust/target/release/build/ext-php-rs-*
          echo "已清除旧的 bindgen 缓存"

      # -----------------------------------------------------------------
      # 步骤 3: 安装 Rust 工具链（含 clippy 组件）
      # -----------------------------------------------------------------
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
          components: clippy, rustfmt

      # -----------------------------------------------------------------
      # 步骤 4: 缓存
      # -----------------------------------------------------------------
      - name: Cache cargo artifacts
        uses: actions/cache@v4
        with:
          path: |
            rust/target
            ~/.cargo/registry
            ~/.cargo/git
          key: linux-rust-lint-${{ hashFiles('rust/Cargo.lock') }}
          restore-keys: |
            linux-rust-lint-

      # -----------------------------------------------------------------
      # 步骤 5: 代码格式检查
      # -----------------------------------------------------------------
      - name: Check formatting
        working-directory: rust
        run: |
          echo "=== 检查代码格式 ==="
          cargo fmt -- --check

      # -----------------------------------------------------------------
      # 步骤 6: Clippy 静态分析
      # 不启用 php feature（避免依赖 PHP 开发头文件）
      # -----------------------------------------------------------------
      - name: Run Clippy
        working-directory: rust
        run: |
          echo "=== 运行 Clippy 静态分析 ==="
          cargo clippy -- -D warnings

      # -----------------------------------------------------------------
      # 步骤 7: 运行测试
      # 不启用 php feature，仅测试核心逻辑
      # -----------------------------------------------------------------
      - name: Run tests
        working-directory: rust
        run: |
          echo "=== 运行测试 ==="
          cargo test
